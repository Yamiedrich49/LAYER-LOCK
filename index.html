<style>

*{box-sizing:border-box}html{background:var(--bg);min-height:100%}body{margin:0;min-height:100dvh;color:var(--ink);background:radial-gradient(ellipse 72% 34% at 50% -18%,rgba(94,195,169,.18),transparent 90%),linear-gradient(168deg,#102631 0%,#091820 55%,#07141d 100%);overscroll-behavior:none}button{-webkit-tap-highlight-color:transparent;appearance:none;font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--mint);outline-offset:4px}button:disabled{cursor:default;opacity:.3}svg{display:block}.app{width:min(100%,520px);margin:auto;min-height:100dvh;padding:calc(env(safe-area-inset-top) + 16px) 19px calc(env(safe-area-inset-bottom) + 18px);display:flex;flex-direction:column;align-items:stretch}
.head{display:flex;align-items:center;justify-content:space-between;min-height:41px;gap:14px}.brand{display:flex;align-items:center;gap:10px}.mark{width:35px;height:35px;border:1px solid #6bc7b53b;border-radius:12px;background:linear-gradient(135deg,#b6f1dc16,#3b887d11);display:grid;place-items:center}.mark svg{width:22px;height:22px}.brand-title{font-size:18px;font-weight:770;letter-spacing:.085em;line-height:1.05}.brand-sub{margin-top:5px;font-size:8px;font-weight:690;letter-spacing:.22em;color:#75acaa}.head-right{display:flex;align-items:center;gap:13px}.level-count{font-size:11px;letter-spacing:.045em;color:#a8c1be;font-variant-numeric:tabular-nums}.level-count strong{font-size:17px;color:#f0f8f2;letter-spacing:.01em}.icon-button{display:grid;place-items:center;width:36px;height:36px;background:#ffffff09;border:1px solid var(--line);border-radius:13px;color:#c2dfd8}.icon-button svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.progress{display:flex;gap:5px;margin-top:15px}.progress button{height:4px;min-width:0;flex:1;border:0;border-radius:20px;padding:0;background:#8eb9b329;transition:background .25s}.progress button.solved{background:#75c3af95}.progress button.current{background:#c6f6d9;box-shadow:0 0 13px #a5f8d53d}.progress button.locked{cursor:default}
.intro{display:flex;align-items:end;justify-content:space-between;margin-top:17px;margin-bottom:9px}.eyebrow{color:#87b3ab;font-size:10px;font-weight:720;letter-spacing:.17em}.intro h1{font-size:19px;line-height:1.35;margin:7px 0 0;font-weight:700;letter-spacing:.01em}.intro-help{font-size:10px;color:#88a9a6;white-space:nowrap;padding-bottom:5px}
.comparison{height:clamp(109px,15.2dvh,126px);border:1px solid var(--line);border-radius:20px;background:linear-gradient(110deg,#152d369c,#0b222da8);display:grid;grid-template-columns:1fr 1px 1fr;gap:0;align-items:center;padding:9px 10px;overflow:hidden}.comparison-divider{height:80%;background:linear-gradient(transparent,#a9dbce2c,transparent)}.compare-half{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}.compare-label{font-size:9px;letter-spacing:.16em;color:#91b5b0;font-weight:750}.compare-grid{width:clamp(72px,10.9dvh,90px);aspect-ratio:1;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:3px;padding:4px;border:1px solid rgba(154,220,203,.12);border-radius:10px;background:#06151e80}.cell{display:grid;place-items:center;min-width:0;aspect-ratio:1}.orb{width:69%;aspect-ratio:1;border-radius:50%;background:#35545b66;border:1px solid #79999523}.cell.lit .orb{background:#b6f9db;box-shadow:0 0 7px #92f2cb5e,inset 0 0 0 1px #d7ffec5e;border:none}.cell.extra .orb{background:#e8ba9e;box-shadow:0 0 7px #edaa8e4b;border:none}.cell.missing .orb{background:#173239;border:1.5px dashed #7bd2bf;box-shadow:none}.cell.blank .orb{background:#35545b50;border-color:transparent}.compare-grid.hidden-result .orb{background:transparent;border-color:#4f757740;box-shadow:none}.compare-grid.hidden-result{opacity:.7}.compare-grid.revealed{animation:appear .22s both}
.workbench{position:relative;display:flex;align-items:center;justify-content:center;flex-direction:column;flex:none;min-height:0;margin-top:12px}.work-label{position:absolute;top:0;left:0;right:0;text-align:center;font-size:9px;letter-spacing:.19em;color:#86aba7;font-weight:740;z-index:1;pointer-events:none}.stage-shell{position:relative;width:var(--board-size);height:var(--board-size);margin-top:17px;display:grid;place-items:center}.stage-shell:before{content:"";position:absolute;inset:-12px;border-radius:29px;background:radial-gradient(circle,#73baab17,transparent 74%);pointer-events:none}.stack-spot{width:100%;height:100%;position:relative;border-radius:18px;border:1px solid #7eb9ad27;background:linear-gradient(135deg,#11313b91,#0c2530c9);box-shadow:inset 0 1px #d5fff50a,0 16px 39px #00000016;overflow:hidden}.stack-spot:before{content:"";position:absolute;inset:5%;border:1px dashed #a8e7d12a;border-radius:14px;pointer-events:none}.stack-spot .base-light{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .22s;z-index:1;filter:drop-shadow(0 0 2px #75f2d965)}.stack-spot.lighting .base-light{opacity:1}.idle-graphic{position:absolute;inset:0;display:grid;place-items:center;transition:opacity .23s;z-index:2;pointer-events:none}.idle-graphic svg{width:53%;height:53%;opacity:.4}.stack-spot.lighting .idle-graphic{opacity:0}.stage-hint{font-size:10px;color:#83a9a5;text-align:center;margin:11px 0 0;min-height:15px;transition:color .2s}.stage-hint.active{color:#baf7df}
.section-bar{display:flex;align-items:center;justify-content:space-between;margin-top:11px;margin-bottom:7px}.section-bar strong{font-size:10px;letter-spacing:.15em;color:#bdd7ce;font-weight:730}.section-bar span{font-size:10px;color:#7faaa4}.paper-rail{display:grid;grid-template-columns:repeat(var(--count),minmax(0,1fr));gap:12px;align-items:start}.sheet{min-width:0;padding:6px 6px 7px;border-radius:16px;background:linear-gradient(175deg,rgba(186,225,215,.115),rgba(186,225,215,.035));border:1px solid #a0d6c720;display:flex;flex-direction:column;align-items:center;gap:6px;transition:opacity .2s}.sheet-top{width:100%;display:flex;align-items:center;justify-content:space-between;gap:2px;padding:0px 5px}.sheet-name{font-size:11px;letter-spacing:.08em;font-weight:790;color:#d9f1e8}.sheet-status{font-size:9px;color:#8fb6af}.sheet.locked .sheet-status{color:#e3d0b3}.sheet-surface{position:relative;width:100%;max-width:min(14dvh,122px);aspect-ratio:1;touch-action:none;cursor:grab;border-radius:10px;user-select:none;-webkit-user-select:none}.sheet-surface:active{cursor:grabbing}.sheet.locked .sheet-surface{cursor:default;touch-action:pan-y}.paper-rotator{position:relative;width:100%;height:100%;transform:rotate(0deg);will-change:transform;transition:transform .28s cubic-bezier(.21,.91,.23,1)}.sheet-surface .paper-svg{width:100%;height:100%;filter:drop-shadow(0 6px 8px #00000036)}.sheet .touch-cue{font-size:9px;line-height:1.2;text-align:center;color:#8dada8;letter-spacing:.03em}.sheet.locked .touch-cue{color:#d6c19c}.sheet.flying{opacity:.15}.sheet.pulse .paper-rotator{filter:drop-shadow(0 0 5px #a6eed559)}
.controls{display:flex;gap:10px;margin-top:12px}.primary{flex:1;min-height:52px;display:flex;align-items:center;justify-content:center;gap:11px;border-radius:15px;border:1px solid #ceffe5b3;background:linear-gradient(160deg,#b9f0d8,#83dac2);color:#133a37;font-size:14px;font-weight:790;letter-spacing:.065em;box-shadow:0 9px 28px #6cc5a51a;transition:transform .15s,filter .2s}.primary:active{transform:scale(.985);filter:brightness(.94)}.primary svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.secondary{width:52px;min-height:52px;border-radius:15px;background:#ffffff09;border:1px solid var(--line);color:#cde5dd;display:grid;place-items:center}.secondary svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.feedback{min-height:27px;margin-top:12px;display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;color:#95b4b1;line-height:1.4;text-align:center}.feedback.success{color:#c8ffdf}.feedback.wrong{color:#edc7ac}.feedback .indicator{width:6px;height:6px;border-radius:50%;background:currentColor}.footer{margin-top:auto;padding-top:10px;display:flex;align-items:center;justify-content:center;gap:10px;color:#4c7978;font-size:9px;letter-spacing:.14em;font-weight:700}.footer span{width:22px;height:1px;background:#659b8d53}
.flight{position:fixed;pointer-events:none;z-index:50;will-change:transform;transform-origin:top left}.flight .paper-svg{width:100%;height:100%;filter:drop-shadow(0 8px 13px #0000004d)}.flight .paper-rotator{transition:none}.flight .paper-svg{border-radius:0}.stack-spot.confirmed{border-color:#9ff5d18c;box-shadow:0 0 30px #a2f6cf18,inset 0 0 14px #6bcca323}.stack-spot.confirmed .base-light{filter:drop-shadow(0 0 6px #9af9ce9c)}.stack-spot.failed{border-color:#dcae9445}
@keyframes appear{from{opacity:0;transform:scale(.93)}to{opacity:1;transform:scale(1)}}
@media(max-height:740px){.app{--board-size:clamp(144px,min(21.5dvh,48vw),192px)!important;padding-top:calc(env(safe-area-inset-top) + 10px)}.progress{margin-top:11px}.intro{margin-top:11px;margin-bottom:7px}.intro h1{margin-top:4px;font-size:17px}.comparison{height:107px}.compare-grid{width:74px}.workbench{margin-top:7px}.stage-shell{margin-top:12px}.stage-hint{margin-top:5px}.section-bar{margin-top:8px;margin-bottom:6px}.paper-rail{gap:8px}.sheet{gap:2px;padding:4px 4px 5px}.sheet-surface{max-width:min(12.5dvh,108px)}.controls{margin-top:8px}.primary,.secondary{min-height:45px}.secondary{width:45px}.feedback{margin-top:6px}.footer{padding-top:7px}}
@media(max-width:350px){.app{padding-left:12px;padding-right:12px}.paper-rail{gap:6px}.brand-title{font-size:16px}.intro-help{font-size:9px}.sheet{padding:4px}.sheet-status{font-size:8px}.section-bar span{font-size:9px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

<body>
<main id="app" class="app" style="--board-size:clamp(166px,min(23.7dvh,54vw),220px)"></main>
<script>
'use strict';
// The original 12 levels, unchanged, from FOLD-CUT-NEXT-LAB, commit 71b5501.
const LAYER_LEVELS=[{"n":3,"masks":[69,405],"lock":true,"target":68},{"n":3,"masks":[13,330],"lock":true,"target":5},{"n":4,"masks":[63904,64830],"lock":false,"target":28691},{"n":4,"masks":[64299,3687],"lock":false,"target":1095},{"n":4,"masks":[56615,43551],"lock":false,"target":38948},{"n":4,"masks":[43835,64863,40830],"lock":false,"target":38932},{"n":4,"masks":[44031,65454,62076],"lock":false,"target":16924},{"n":4,"masks":[31677,47037,28860],"lock":false,"target":41104},{"n":5,"masks":[13622988,32046963,29031087],"lock":false,"target":11073538},{"n":5,"masks":[16637435,11366256,18736895],"lock":false,"target":1655114},{"n":5,"masks":[23867101,32436045,31950621],"lock":false,"target":1130884},{"n":5,"masks":[31184829,15466095,26324987],"lock":false,"target":8423352}];
const STORAGE='layer_lock_standalone_v1';
const paperColors=['#e2eee8','#d2e5e1','#c6dedf'];
const el=document.querySelector('#app');
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const icons={
 sound:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="M16 9a5 5 0 0 1 0 6M18.5 6a9 9 0 0 1 0 12"/></svg>',
 mute:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4Z"/><path d="m17 9 5 6m0-6-5 6"/></svg>',
 undo:'<svg viewBox="0 0 24 24"><path d="M9 7 5 11l4 4M5 11h8a6 6 0 1 1 0 12" transform="translate(0 -3)"/></svg>',
 stack:'<svg viewBox="0 0 24 24"><path d="m3 8 9-5 9 5-9 5-9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></svg>',
 next:'<svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>'};
function load(){let s={};try{s=JSON.parse(localStorage.getItem(STORAGE)||'{}')||{}}catch(_){};const solved=Array.isArray(s.solved)?s.solved.filter(x=>Number.isInteger(x)&&x>=0&&x<LAYER_LEVELS.length):[];return {solved:[...new Set(solved)],unlocked:Math.min(12,Math.max(1,Number(s.unlocked)||1)),sound:s.sound!==false};}
const save=load();let stage=Math.min(save.unlocked-1,11),turns=[],angles=[],busy=false,won=false,requestId=0,flightNodes=[],audioCtx=null,gesture=null,feedback='',result=null,stageHint='';
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(save))}catch(_){}}
function rotated(mask,n,turn){turn=((turn%4)+4)%4;for(let t=0;t<turn;t++){let m=0;for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(mask&(1<<(y*n+x)))m|=1<<(x*n+(n-1-y));mask=m}return mask}
function intersect(level,ts){let v=(1<<(level.n*level.n))-1;for(let i=0;i<level.masks.length;i++)v&=rotated(level.masks[i],level.n,ts[i]);return v}
function verify(){LAYER_LEVELS.forEach((l,i)=>{let count=0;for(let a=0;a<4;a++)for(let b=0;b<4;b++)for(let c=0;c<(l.masks.length===3?4:1);c++){if(l.lock&&a)continue;if(intersect(l,l.masks.length===3?[a,b,c]:[a,b])===l.target)count++}if(count!==1)throw Error('Stage '+(i+1)+' has '+count+' solutions');});return true}
function holeRadius(n){return n===3?10:n===4?7.8:6.1}
function roundRectPath(){return 'M12 2H88Q98 2 98 12V88Q98 98 88 98H12Q2 98 2 88V12Q2 2 12 2Z'}
function sheetSvg(n,mask,i){const rad=holeRadius(n),color=paperColors[i];const holes=[];const rims=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(!(mask & (1<<(y*n+x))))continue;const cx=100*(x+.5)/n,cy=100*(y+.5)/n;holes.push(`M${(cx+rad).toFixed(4)} ${cy.toFixed(4)} a${rad} ${rad} 0 1 0 ${-2*rad} 0 a${rad} ${rad} 0 1 0 ${2*rad} 0Z`);rims.push(`<circle cx="${cx}" cy="${cy}" r="${rad+0.35}" fill="none" stroke="#638a89" stroke-opacity=".52" stroke-width=".7"/>`)}return `<svg class="paper-svg" viewBox="0 0 100 100" role="img" aria-label="穴の開いた紙 ${'ABC'[i]}"><path d="${roundRectPath()} ${holes.join(' ')}" fill="${color}" fill-rule="evenodd"/><path d="${roundRectPath()}" fill="none" stroke="#f5fffa" stroke-opacity=".55" stroke-width=".62"/>${rims.join('')}<path d="M9 8h6M9 8v6" fill="none" stroke="#799e98" stroke-width=".6" stroke-linecap="round" opacity=".48"/></svg>`}
function backgroundLight(n){const r=holeRadius(n)-1.1;let c='';for(let y=0;y<n;y++)for(let x=0;x<n;x++){const cx=100*(x+.5)/n,cy=100*(y+.5)/n;c+=`<circle cx="${cx}" cy="${cy}" r="${r+1.1}" fill="#70ddc5" opacity=".19"/><circle cx="${cx}" cy="${cy}" r="${r-.25}" fill="#b2f9da"/><circle cx="${cx-1}" cy="${cy-1.5}" r="${Math.max(1.2,r*.26)}" fill="#effff6" opacity=".55"/>`}return `<svg class="base-light" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">${c}</svg>`}
function compareGrid(n,mask,goal,kind){let out='';for(let p=0;p<n*n;p++){const on=mask!==null&&(mask&(1<<p)),wanted=!!(goal&(1<<p));const klass=kind==='target'?(on?'lit':'blank'):mask===null?'blank':on?(wanted?'lit':'extra'):(wanted?'missing':'blank');out+=`<div class="cell ${klass}"><i class="orb"></i></div>`}return `<div class="compare-grid ${mask===null?'hidden-result':'revealed'}" style="--n:${n}" aria-label="${kind==='target'?'目標の光':'重なった結果'}">${out}</div>`}
function stageNumber(){return String(stage+1).padStart(2,'0')}
function paint(){const l=LAYER_LEVELS[stage];let title=stage<2?'光のかたちを、つくる。':l.masks.length===3?'3枚の紙を、重ねる。':'光の通り道を、見つける。';let label=won?'CLEARED':result===null?'LIGHT PATTERN':'COMPARISON';el.innerHTML=`
  <header class="head"><div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="4" stroke="#99e6c9" stroke-width="1.2"/><circle cx="8" cy="8" r="2" fill="#9ce9cc"/><circle cx="16" cy="8" r="2" stroke="#9ce9cc"/><circle cx="8" cy="16" r="2" stroke="#9ce9cc"/><circle cx="16" cy="16" r="2" fill="#9ce9cc"/></svg></span><div><div class="brand-title">LAYER LOCK</div><div class="brand-sub">LIGHT THROUGH LAYERS</div></div></div><div class="head-right"><span class="level-count"><strong>${stageNumber()}</strong> / 12</span><button id="sound" class="icon-button" aria-label="音を${save.sound?'消す':'出す'}">${save.sound?icons.sound:icons.mute}</button></div></header>
  <nav class="progress" aria-label="問題を選択">${LAYER_LEVELS.map((_,i)=>`<button data-stage="${i}" class="${i===stage?'current':save.solved.includes(i)?'solved':i>=save.unlocked?'locked':''}" ${i>=save.unlocked?'disabled':''} aria-label="問題${i+1}${i>=save.unlocked?' 未開放':''}" title="問題 ${i+1}"></button>`).join('')}</nav>
  <section class="intro"><div><div class="eyebrow" id="state-label">${label}</div><h1>${title}</h1></div><div class="intro-help">${l.n} × ${l.n} · ${l.masks.length} LAYERS</div></section>
  <section class="comparison" aria-label="目標と結果の比較"><div class="compare-half"><div class="compare-label">TARGET</div><div id="target-grid">${compareGrid(l.n,l.target,l.target,'target')}</div></div><div class="comparison-divider"></div><div class="compare-half"><div class="compare-label" id="result-label">${result===null?'RESULT':'RESULT'}</div><div id="result-grid">${compareGrid(l.n,result,l.target,'result')}</div></div></section>
  <section class="workbench"><div class="work-label">${won?'LIGHT CONNECTED':'THE LIGHT TABLE'}</div><div class="stage-shell"><div id="stack-spot" class="stack-spot"><div class="idle-graphic"><svg viewBox="0 0 120 120" fill="none"><rect x="21" y="26" width="70" height="70" rx="7" stroke="#8ecdbf" stroke-width="1.2" transform="rotate(-9 56 61)"/><rect x="30" y="18" width="70" height="70" rx="7" stroke="#8ecdbf" stroke-width="1.2" transform="rotate(9 65 53)"/><circle cx="55" cy="46" r="7" stroke="#9fdfc9"/><circle cx="77" cy="68" r="7" stroke="#9fdfc9"/><path d="M46 68h12m-6-6v12" stroke="#9fdfc9" stroke-width="1.1"/></svg></div>${backgroundLight(l.n)}</div></div><div id="stage-hint" class="stage-hint">${won?'光が、つながった。':'紙を回して、重ねてみよう'}</div></section>
  <div class="section-bar"><strong>YOUR LAYERS</strong><span>${l.lock?'A は固定 · B を回す':'紙を指で回す · 90°で吸着'}</span></div>
  <section class="paper-rail" style="--count:${l.masks.length}" aria-label="回転する紙">${l.masks.map((mask,i)=>`<div class="sheet ${l.lock&&i===0?'locked':''}" data-sheet="${i}"><div class="sheet-top"><span class="sheet-name">${'ABC'[i]}</span><span class="sheet-status">${l.lock&&i===0?'● 固定':'↻ かいてん'}</span></div><div class="sheet-surface" data-surface="${i}" role="button" aria-label="${'ABC'[i]}の紙。${l.lock&&i===0?'固定されている':'指で回転'}" tabindex="${l.lock&&i===0?'-1':'0'}"><div class="paper-rotator" data-rotator="${i}" style="transform:rotate(${angles[i]}deg)">${sheetSvg(l.n,mask,i)}</div></div><div class="touch-cue">${l.lock&&i===0?'FIXED':'DRAG / TAP'}</div></div>`).join('')}</section>
  <div class="controls"><button class="secondary" id="reset" title="回転をもとに戻す" aria-label="紙を元の位置に戻す" ${busy?'disabled':''}>${icons.undo}</button><button class="primary" id="check" ${busy?'disabled':''}>${won?`次の問題 ${icons.next}`:`${icons.stack} 重ねてみる`}</button></div>
  <div id="feedback" class="feedback ${won?'success':result!==null?'wrong':''}">${won?'✦ ぴったり。すべての光が一致した。':feedback||'穴が全部重なるところだけ、光が通る。'}</div>
  <footer class="footer"><span></span>THINK · ROTATE · REVEAL<span></span></footer>`;
  wire();
}
function audio(){if(!save.sound)return null;try{audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(_){return null}}
function note(freq,duration=.12,volume=.02,at=0){const ctx=audio();if(!ctx)return;const t=ctx.currentTime+at;const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(volume,t+.009);g.gain.exponentialRampToValueAtTime(.0001,t+duration);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+duration+.01)}
function sfx(kind){if(kind==='turn'){note(464,.065,.014);note(696,.12,.010,.029)}if(kind==='tap')note(510,.065,.012);if(kind==='land'){note(392,.11,.013);note(588,.11,.008,.035)}if(kind==='wrong')note(360,.16,.009);if(kind==='win'){[392,493.88,587.33,783.99].forEach((f,i)=>note(f,.36,.012,i*.085))}}
function selectLevel(index){if(index>=save.unlocked||index<0)return;requestId++;cleanupFlights();stage=index;turns=LAYER_LEVELS[stage].masks.map(()=>0);angles=turns.map(()=>0);won=false;result=null;feedback='';busy=false;gesture=null;paint();}
function updateRotation(i,angle,animate=true){const rot=el.querySelector(`[data-rotator="${i}"]`);if(!rot)return;rot.style.transition=animate?'transform .31s cubic-bezier(.19,.93,.19,1)':'none';rot.style.transform=`rotate(${angle}deg)`;}
function makeTurn(i,d){const l=LAYER_LEVELS[stage];if(busy||won||l.lock&&i===0)return;const diff=Math.max(-4,Math.min(4,d));if(!diff)return;angles[i]+=diff*90;turns[i]=(turns[i]+diff%4+4)%4;updateRotation(i,angles[i]);result=null;feedback='';refreshComparison();sfx('turn')}
function refreshComparison(){const l=LAYER_LEVELS[stage];const grid=el.querySelector('#result-grid');if(grid)grid.innerHTML=compareGrid(l.n,result,l.target,'result');const state=el.querySelector('#state-label');if(state)state.textContent='LIGHT PATTERN';const feedbackEl=el.querySelector('#feedback');if(feedbackEl){feedbackEl.className='feedback';feedbackEl.textContent='穴が全部重なるところだけ、光が通る。'}}
function pointerAngle(x,y,rect){return Math.atan2(y-(rect.top+rect.height/2),x-(rect.left+rect.width/2))}
function down(e){if(busy||won||gesture)return;const surface=e.currentTarget,i=Number(surface.dataset.surface),l=LAYER_LEVELS[stage];if(l.lock&&i===0)return;if(e.pointerType==='mouse'&&e.button!==0)return;const rect=surface.getBoundingClientRect();gesture={i,pid:e.pointerId,rect,x:e.clientX,y:e.clientY,last:pointerAngle(e.clientX,e.clientY,rect),delta:0,moved:0,startAngle:angles[i]};try{surface.setPointerCapture(e.pointerId)}catch(_){};}
function move(e){if(!gesture||gesture.pid!==e.pointerId||Number(e.currentTarget.dataset.surface)!==gesture.i)return;const g=gesture;const next=pointerAngle(e.clientX,e.clientY,g.rect);let da=next-g.last;if(da>Math.PI)da-=2*Math.PI;else if(da< -Math.PI)da+=2*Math.PI;g.delta+=da;g.last=next;g.moved=Math.hypot(e.clientX-g.x,e.clientY-g.y);if(g.moved>5)updateRotation(g.i,g.startAngle+g.delta*180/Math.PI,false)}
function up(e){if(!gesture||gesture.pid!==e.pointerId||Number(e.currentTarget.dataset.surface)!==gesture.i)return;const g=gesture;gesture=null;const deg=g.delta*180/Math.PI;let steps;if(g.moved<8)steps=1;else if(Math.abs(deg)>=16)steps=Math.round(deg/90)||Math.sign(deg);else if(Math.abs(e.clientX-g.x)>20)steps=Math.sign(e.clientX-g.x);else steps=0;steps=Math.max(-3,Math.min(3,steps));if(steps)makeTurn(g.i,steps);else updateRotation(g.i,g.startAngle,true)}
function cancel(e){if(gesture&&gesture.pid===e.pointerId){updateRotation(gesture.i,gesture.startAngle);gesture=null}}
function wire(){el.querySelector('#sound').addEventListener('click',()=>{save.sound=!save.sound;persist();el.querySelector('#sound').innerHTML=save.sound?icons.sound:icons.mute;el.querySelector('#sound').setAttribute('aria-label',`音を${save.sound?'消す':'出す'}`);if(save.sound)sfx('tap')});el.querySelectorAll('[data-stage]').forEach(b=>b.addEventListener('click',()=>selectLevel(Number(b.dataset.stage))));el.querySelector('#reset').addEventListener('click',()=>{if(busy)return;const l=LAYER_LEVELS[stage];turns=l.masks.map(()=>0);angles=turns.map(()=>0);turns.forEach((_,i)=>updateRotation(i,0));result=null;feedback='';won=false;refreshComparison();sfx('tap')});el.querySelector('#check').addEventListener('click',()=>won?selectLevel(stage===11?0:stage+1):check());el.querySelectorAll('[data-surface]').forEach(s=>{s.addEventListener('pointerdown',down);s.addEventListener('pointermove',move);s.addEventListener('pointerup',up);s.addEventListener('pointercancel',cancel);s.addEventListener('keydown',e=>{if(['Enter',' ','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();makeTurn(Number(s.dataset.surface),e.key==='ArrowLeft'?-1:1)}})});}
function cleanupFlights(){for(const node of flightNodes){for(const anim of node.getAnimations())anim.cancel();node.remove()}flightNodes=[];el.querySelectorAll('.sheet.flying').forEach(n=>n.classList.remove('flying'));el.querySelector('#stack-spot')?.classList.remove('lighting','confirmed','failed')}
function flightElement(i){const source=el.querySelector(`[data-surface="${i}"]`),rotator=source.querySelector('.paper-rotator'),b=source.getBoundingClientRect();const f=document.createElement('div');f.className='flight';f.style.cssText=`left:${b.left}px;top:${b.top}px;width:${b.width}px;height:${b.height}px;z-index:${50+i}`;f.innerHTML=rotator.outerHTML;document.body.appendChild(f);flightNodes.push(f);el.querySelector(`[data-sheet="${i}"]`).classList.add('flying');return {f,b};}
async function check(){if(busy||won)return;busy=true;const run=++requestId,l=LAYER_LEVELS[stage],out=intersect(l,turns),correct=out===l.target;el.querySelector('#check').disabled=true;el.querySelector('#reset').disabled=true;el.querySelector('#stage-hint').textContent='光を、重ねる。';el.querySelector('#stage-hint').classList.add('active');const target=el.querySelector('#stack-spot');const dest=target.getBoundingClientRect(),flights=[];for(let i=0;i<l.masks.length;i++){const flight=flightElement(i),src=flight.b;const tx=dest.left-src.left,ty=dest.top-src.top,sx=dest.width/src.width,sy=dest.height/src.height;const end=`translate(${tx}px,${ty}px) scale(${sx},${sy})`;const duration=430,delay=i*135;flight.end=end;flight.anim=flight.f.animate([{transform:'translate(0,0) scale(1,1)'},{transform:end}],{duration,delay,easing:'cubic-bezier(.2,.87,.23,1)',fill:'forwards'});flights.push(flight);setTimeout(()=>{if(run!==requestId)return;target.classList.add('lighting');sfx('land')},delay+duration-45)}await sleep(430+(l.masks.length-1)*135+160);if(run!==requestId)return;result=out;const grid=el.querySelector('#result-grid');if(grid)grid.innerHTML=compareGrid(l.n,result,l.target,'result');el.querySelector('#state-label').textContent='COMPARISON';const feedbackEl=el.querySelector('#feedback');feedbackEl.className='feedback '+(correct?'success':'wrong');const exactMissing=bitCount(l.target&~out),extra=bitCount(out&~l.target);feedbackEl.textContent=correct?'✦ ぴったり。すべての光が一致した。':`光が足りない ${exactMissing} · 余分な光 ${extra}`;target.classList.add(correct?'confirmed':'failed');el.querySelector('#stage-hint').textContent=correct?'光が、つながった。':'光の通り方を、見比べよう。';if(correct){won=true;save.solved=[...new Set([...save.solved,stage])].sort((a,b)=>a-b);save.unlocked=Math.max(save.unlocked,Math.min(LAYER_LEVELS.length,stage+2));persist();sfx('win');el.querySelector('#check').innerHTML=stage===11?`最初の問題へ ${icons.next}`:`次の問題 ${icons.next}`;el.querySelector('#check').disabled=false;el.querySelector('#reset').disabled=true;return}
 sfx('wrong');await sleep(670);if(run!==requestId)return;await Promise.all(flights.map(async ({f,b,end,anim},i)=>{anim.cancel();f.style.transform=end;const a=f.animate([{transform:end},{transform:'translate(0,0) scale(1,1)'}],{duration:310,delay:i*35,easing:'cubic-bezier(.25,.75,.29,1)',fill:'forwards'});await a.finished.catch(()=>{});}));if(run!==requestId)return;cleanupFlights();el.querySelector('#stage-hint').textContent='紙を回して、もう一度。';el.querySelector('#stage-hint').classList.remove('active');el.querySelector('#check').disabled=false;el.querySelector('#reset').disabled=false;busy=false;
}
function bitCount(n){let c=0;while(n){n&=n-1;c++}return c}
try{verify();selectLevel(stage)}catch(err){console.error(err);el.textContent='問題データに不整合があります: '+err.message}
</script>
