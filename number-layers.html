<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">

<meta name="description" content="LAYER LOCK — Two moving layers, one perfect sum.">
<title>LAYER LOCK — Number Study</title>
<style>
:root{
  color-scheme:dark;--bg:#091923;--ink:#eff7f3;--muted:#92aeb0;--faint:#64848a;
  --mint:#a8efda;--mint-rich:#85d9c3;--paper-a:#87c3b5;--paper-b:#b6c7de;
  --line:rgba(197,232,224,.12);--spring:cubic-bezier(.18,.88,.24,1);
  font-family:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN",sans-serif;
  font-synthesis:none;-webkit-font-smoothing:antialiased;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg)}
body{background:radial-gradient(ellipse 110% 42% at 50% -20%,#23505860,transparent 82%),linear-gradient(175deg,#102833 0%,#091923 58%,#071720 100%);color:var(--ink);overscroll-behavior:none}
button,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{font:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.34}
button:focus-visible,a:focus-visible{outline:2px solid var(--mint);outline-offset:3px}
svg{display:block}
.app{max-width:530px;width:100%;height:100dvh;min-height:510px;margin:auto;padding:calc(env(safe-area-inset-top) + 9px) 18px calc(env(safe-area-inset-bottom) + 9px);display:flex;flex-direction:column;align-items:center;overflow:hidden}
.top{width:100%;height:45px;display:flex;flex-shrink:0;align-items:center;justify-content:space-between}
.logo{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit}
.logo-mark{width:29px;height:29px;display:block}
.brand{font-size:11px;font-weight:760;letter-spacing:.19em;line-height:1.35}
.brand small{display:block;color:#88a8a7;font-size:8px;font-weight:600;letter-spacing:.18em;margin-top:3px}
.actions{display:flex;align-items:center;gap:4px}
.iconbtn{display:grid;place-items:center;width:35px;height:39px;border:0;background:none;color:#b8d0cb;border-radius:12px}
.iconbtn svg{width:19px;height:19px}.iconbtn:active{background:#d6ffee12}
.stage-line{width:100%;height:35px;display:flex;flex-shrink:0;align-items:center;justify-content:space-between}
.stage-title{color:#a9d7cc;font-size:10px;letter-spacing:.13em;font-weight:720}
.stage-nav{display:flex;align-items:center;gap:3px;color:#9ab4b1}
.navbtn{width:32px;height:31px;border:none;background:none;color:#b4cfc6;font-size:25px;line-height:1;border-radius:9px}
.stage-count{height:32px;min-width:65px;padding:4px 6px;border:0;background:transparent;color:#abc5c1;font-size:11px;letter-spacing:.07em;font-weight:690}
.thinprogress{width:100%;height:2px;flex-shrink:0;background:#afd5c51c;border-radius:5px;overflow:hidden}
.thinprogress div{height:100%;width:10%;background:var(--mint-rich);transition:width .32s var(--spring)}
.metrics{height:clamp(98px,13dvh,119px);width:100%;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:0}
.metric{width:44%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.metric .tag{font-size:9px;letter-spacing:.19em;color:#92b9b1;font-weight:720}
.metric strong{font-weight:620;font-size:clamp(45px,7.7dvh,67px);line-height:.96;letter-spacing:-.07em;font-variant-numeric:tabular-nums;transition:color .18s,transform .28s var(--spring)}
.metric.current strong{color:#a3bbc0}.metric.current strong.hit{color:#b5f5d9}
.metric.current strong.rebound{animation:sum-pop .32s var(--spring)}
@keyframes sum-pop{from{transform:translateY(2px) scale(.965)}to{transform:translateY(0) scale(1)}}
.separation{width:1px;height:43px;background:linear-gradient(transparent,#466467,transparent)}
.equation{height:27px;display:flex;flex-shrink:0;align-items:center;justify-content:center;gap:6px;width:100%;overflow:hidden;white-space:nowrap;letter-spacing:.01em;font-size:12px;font-weight:580;color:#a6c8c0}
.equation strong{font-size:13px;color:#e9fff1;font-weight:720}
.equation .empty{color:#638d8b;font-size:11px;letter-spacing:.04em}
.equation.solved{color:#bbefdb}
.board-wrap{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center;position:relative}
.board{position:relative;width:min(100%,344px,calc(100dvh - 366px));aspect-ratio:1;border-radius:23px;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;background:linear-gradient(155deg,#15313b,#11242e);box-shadow:0 18px 46px #01080b38,0 0 0 1px #95c8bf32,inset 0 1px #e1fff20e;isolation:isolate}
.board::after{position:absolute;content:"";inset:0;z-index:15;pointer-events:none;border-radius:23px;box-shadow:inset 0 0 23px #03161c4d,inset 0 0 0 1px #9bd2c429}
.grid-nums,.grid-sparks{position:absolute;inset:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(4,minmax(0,1fr));pointer-events:none}
.grid-nums{z-index:1}
.number-cell{display:grid;place-items:center;position:relative;border-right:1px solid #afd6d51a;border-bottom:1px solid #afd6d51a}
.number-cell:nth-child(4n){border-right:0}.number-cell:nth-last-child(-n+4){border-bottom:0}
.number-cell .digit{font-size:clamp(21px,4.4dvh,33px);font-weight:600;letter-spacing:-.055em;color:#91aaa9;opacity:.34;font-variant-numeric:tabular-nums}
.grid-sparks{z-index:7}
.grid-sparks .number-cell{border-color:transparent}
.grid-sparks .digit{opacity:0;transform:scale(.97);color:#eefef6;font-weight:720;text-shadow:0 1px 14px #a0ffe339;transition:opacity .16s,transform .22s var(--spring)}
.grid-sparks .number-cell.lit .digit{opacity:1;transform:scale(1)}
.grid-sparks .number-cell.lit::before{content:"";position:absolute;inset:17%;border-radius:50%;background:radial-gradient(circle,#65bba333 0%,transparent 72%);pointer-events:none}
.grid-sparks .number-cell.burst .digit{animation:digit-bloom .62s var(--spring)}
@keyframes digit-bloom{0%{transform:scale(.82);filter:brightness(1.5)}40%{transform:scale(1.095);filter:brightness(1.2)}100%{transform:scale(1);filter:brightness(1)}}
.films{position:absolute;inset:0;z-index:3;pointer-events:none}
.film{position:absolute;top:calc(var(--y)*25%);left:calc(var(--x)*25%);width:75%;height:75%;transition:top .26s var(--spring),left .26s var(--spring),filter .22s;will-change:transform,top,left;pointer-events:none}
.film .rotator{width:100%;height:100%;transform:rotate(var(--turn));transition:transform .3s var(--spring);transform-origin:50% 50%;filter:drop-shadow(1px 4px 5px #05151ba8)}
.film svg{width:100%;height:100%;overflow:visible}
.film.active .rotator{filter:drop-shadow(0 8px 8px #031116a8)}
.film.dragging,.film.dragging .rotator,.film.turning .rotator{transition:none}
.film.dragging .rotator{filter:drop-shadow(0 15px 13px #041017bb)}
.film.active .rim{opacity:1}.film .rim{opacity:0;transition:opacity .16s}
.film .handle{position:absolute;right:10px;top:10px;width:30px;height:30px;display:grid;place-items:center;border-radius:10px;color:#effff5;background:#123038c9;border:1px solid #c9fff0a9;box-shadow:0 2px 8px #061a2088;opacity:0;transform:scale(.84);transition:opacity .16s,transform .2s var(--spring);pointer-events:none}
.film .handle svg{width:15px;height:15px}
.film.active:not(.locked) .handle{opacity:1;transform:scale(1)}
.film .stamp{position:absolute;bottom:11px;right:11px;padding:3px 5px;min-width:19px;border-radius:5px;background:#1029338a;color:#e3fff5;font-size:10px;font-weight:760;text-align:center;letter-spacing:.05em;opacity:.7}
.film .handle:after{content:"";position:absolute;inset:-8px}
.board .input-layer{position:absolute;inset:0;z-index:12;touch-action:none;cursor:grab;outline:0}.board .input-layer:active{cursor:grabbing}
.board.is-moving .grid-sparks{opacity:.72}
.board.is-won::before{content:"";position:absolute;inset:0;z-index:8;pointer-events:none;animation:board-affirm .62s var(--spring)}
@keyframes board-affirm{0%{background:#b5ffe91e}100%{background:transparent}}
.board-marker{position:absolute;z-index:9;left:9px;bottom:9px;font-size:8px;font-weight:700;letter-spacing:.12em;color:#9abfbd;opacity:.65;pointer-events:none}
.sheetrow{width:100%;max-width:344px;display:flex;gap:10px;height:83px;padding:8px 0 3px;flex-shrink:0}
.sheetchoice{position:relative;flex:1;min-width:0;display:flex;align-items:center;gap:11px;padding:7px 11px;border:1px solid #a4d6cf26;border-radius:16px;background:linear-gradient(135deg,#19353d88,#162b35bb);color:#e2f3ec;text-align:left;transition:background .16s,border-color .16s,transform .2s var(--spring)}
.sheetchoice:active{transform:scale(.98)}.sheetchoice.active{border-color:#afedda9f;background:linear-gradient(135deg,#244c4cbe,#1b353e);box-shadow:inset 0 0 0 1px #b0f5db10}
.sheetchoice .preview{height:50px;width:50px;flex-shrink:0;border-radius:8px}
.sheetchoice .name{display:block;font-size:12px;font-weight:800;letter-spacing:.13em}
.sheetchoice .detail{display:block;margin-top:5px;color:#99b3b3;font-size:10px;font-weight:530;letter-spacing:.02em}
.sheetchoice.active .detail{color:#b4d2c9}.sheetchoice.lock .detail{color:#8ea1a7}
.sheetchoice .active-dot{position:absolute;top:10px;right:10px;width:5px;height:5px;border-radius:50%;background:#b9f1db;opacity:0}.sheetchoice.active .active-dot{opacity:1}
.controls{width:100%;max-width:344px;height:61px;flex-shrink:0;display:flex;gap:9px;align-items:center;justify-content:space-between}
.rotate-btn{height:51px;min-width:60px;flex:0 0 60px;display:grid;place-items:center;background:#b1e5d010;border:1px solid #a5d9cd33;border-radius:15px;color:#daede7;transition:background .14s,transform .16s}
.rotate-btn svg{width:23px;height:23px}.rotate-btn:active:not(:disabled){transform:scale(.95);background:#86c7b12c}
.control-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0;text-align:center}
.control-mid b{font-size:10px;letter-spacing:.15em;color:#d9f2e9;font-weight:760}
.control-mid small{font-size:9px;color:#88a6a5;line-height:1.3;letter-spacing:0;white-space:normal}
.nextbtn{width:100%;height:52px;display:flex;align-items:center;justify-content:space-between;border:0;border-radius:15px;background:#b2f0d7;color:#0c3130;padding:0 20px;font-weight:800;font-size:14px;letter-spacing:.05em;box-shadow:0 6px 22px #0a594722}
.nextbtn:active{transform:scale(.985)}
.footer{width:100%;max-width:344px;flex-shrink:0;height:23px;display:flex;align-items:center;justify-content:space-between;font-size:9px;letter-spacing:.1em;color:#628a8b}
.footer a,.footer button{border:0;background:none;color:#84a7a5;text-decoration:none;padding:4px 0;font-size:9px;letter-spacing:.09em}
.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:#031118d9;backdrop-filter:blur(8px)}
.dialog{width:min(100%,355px);padding:23px 23px 21px;background:#152d36;border:1px solid #43635f;border-radius:23px;box-shadow:0 22px 66px #000a}
.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.dialog-head strong{letter-spacing:.08em;font-size:14px}.dialog-head button{background:transparent;border:0;color:#c7dfd7;font-size:20px}
.dialog p{font-size:13px;line-height:1.85;color:#c1d9d2;margin:20px 0}
.gridnav{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin:19px 0}
.levelbtn{aspect-ratio:1;background:#203942;border:1px solid #47646a;border-radius:11px;color:#d4e5dc;font-size:12px;font-weight:750}
.levelbtn.active{border-color:#b1efd5;color:#d5ffe9}.levelbtn.done{background:#2b5049;border-color:#85c2ac}
.dialog-action{width:100%;height:42px;background:#b3efda;border:0;border-radius:12px;color:#0c3130;font-weight:750}
.dialog-action.secondary{background:none;color:#cce4dc;border:1px solid #54736f;margin-top:8px}
.toast{position:fixed;bottom:calc(25px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:50;border:1px solid #50776e;border-radius:11px;padding:9px 13px;background:#24433e;color:#e1f7ed;font-size:11px;white-space:nowrap}
@media(max-height:720px){.metrics{height:96px}.sheetrow{height:71px}.sheetchoice .preview{height:43px;width:43px}.controls{height:57px}.footer{height:20px}.board{width:min(100%,344px,calc(100dvh - 375px))}}
@media(max-width:350px){.app{padding-left:14px;padding-right:14px}.sheetchoice{padding:6px 8px;gap:7px}.sheetchoice .preview{width:40px;height:40px}.sheetchoice .name{font-size:11px}.sheetchoice .detail{font-size:9px}.rotate-btn{flex-basis:52px;min-width:52px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>
</head>

<main class="app">
<header class="top"><a class="logo" href="./" aria-label="LAYER LOCKメインへ戻る"><svg class="logo-mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="3.5" y="3.5" width="25" height="25" rx="5.5" stroke="#a5e2cd" stroke-width="1.3"/><circle cx="11" cy="11" r="3.1" fill="#a5e2cd"/><circle cx="22" cy="11" r="3.1" stroke="#a5e2cd" stroke-width="1.1"/><circle cx="11" cy="22" r="3.1" stroke="#a5e2cd" stroke-width="1.1"/><circle cx="22" cy="22" r="3.1" fill="#a5e2cd"/></svg><div class="brand">LAYER LOCK<small>NUMBER STUDY</small></div></a><div class="actions"><button id="undo" class="iconbtn" aria-label="1手戻す" title="1手戻す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14 4 9l5-5M4 9h10a6 6 0 0 1 0 12h-2"/></svg></button><button id="reset" class="iconbtn" aria-label="最初の配置に戻す" title="最初の配置に戻す"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10V4h6"/><path d="M3.8 10a8 8 0 1 1-.2 5"/></svg></button><button id="sound" class="iconbtn" aria-label="音の切り替え"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9h4l5-4v14l-5-4H3z"/><path class="sound-wave" d="M16 9q4 3 0 6M19 6q7 6 0 12"/></svg></button></div></header>

<script>
'use strict';
const LEVELS=[{"tag":"TURN","values":[2,3,4,5,1,8,2,8,7,6,3,1,7,6,9,9],"masks":[243,111],"target":15,"rules":[{"r":false,"x":false,"y":false},{"r":true,"x":false,"y":false}]},{"tag":"SLIDE","values":[9,1,8,7,6,3,1,2,5,8,4,9,3,4,2,5],"masks":[499,474],"target":16,"rules":[{"r":false,"x":false,"y":false},{"r":false,"x":true,"y":false}]},{"tag":"SHIFT","values":[4,4,6,5,8,1,5,8,7,3,2,2,3,6,1,7],"masks":[188,466],"target":17,"rules":[{"r":false,"x":false,"y":false},{"r":true,"x":true,"y":true}]},{"tag":"TWO TURNS","values":[6,2,5,8,7,4,1,1,3,8,9,6,5,2,3,7],"masks":[459,310],"target":21,"rules":[{"r":true,"x":false,"y":false},{"r":true,"x":true,"y":true}]},{"tag":"CROSS","values":[3,7,1,2,2,5,3,8,4,1,6,9,7,8,6,9],"masks":[467,376],"target":23,"rules":[{"r":true,"x":true,"y":false},{"r":true,"x":true,"y":true}]},{"tag":"COVER","values":[8,3,2,9,4,3,6,5,7,9,5,1,2,4,8,6],"masks":[126,55],"target":25,"rules":[{"r":true,"x":true,"y":true},{"r":true,"x":true,"y":true}]},{"tag":"OFFSET","values":[8,5,7,5,9,4,9,8,3,6,1,2,4,7,2,1],"masks":[436,488],"target":26,"rules":[{"r":true,"x":true,"y":true},{"r":true,"x":true,"y":true}]},{"tag":"MIRROR","values":[2,4,7,2,9,5,1,8,3,7,8,5,6,9,6,4],"masks":[62,121],"target":27,"rules":[{"r":true,"x":true,"y":true},{"r":true,"x":true,"y":true}]},{"tag":"BALANCE","values":[3,9,8,9,4,2,7,5,8,1,2,1,3,4,7,6],"masks":[499,91],"target":30,"rules":[{"r":true,"x":true,"y":true},{"r":true,"x":true,"y":true}]},{"tag":"MASTER","values":[1,4,7,5,8,3,7,9,6,9,1,4,8,2,5,3],"masks":[249,466],"target":29,"rules":[{"r":true,"x":true,"y":true},{"r":true,"x":true,"y":true}]}];
const $=id=>document.getElementById(id),STORE='layer_lock_number_study_v1';
const TEXT={ja:{stages:['まわす','ずらす','重ねる','二つの回転','交差する','覆い隠す','位置を読む','向きを読む','組み合わせる','マスター'],rotate:'回す',slide:'動かす',locked:'固定',rotateTip:'カードの角を回す',slideTip:'カードを指で動かす',fixedTip:'このカードは固定',next:'次の問題へ',complete:'最初から遊ぶ',intro:'両方の穴を通った数字だけが見える',solved:'ぴったり。光がつながった。',how:'A・B両方のカードに穴がある位置の数字だけが合計されます。下のカードをタップして選び、盤面をドラッグして移動。紙の右上の小さな回転マークを指で回すこともできます。下の左右ボタンでも90°回転できます。',picker:'問題を選ぶ',close:'閉じる'},en:{stages:['FIRST TURN','SLIDE','OVERLAP','TWO TURNS','CROSS','COVER','OFFSET','ORIENT','COMBINE','MASTER'],rotate:'Rotate',slide:'Move',locked:'Fixed',rotateTip:'Turn from the corner',slideTip:'Drag the sheet',fixedTip:'This sheet is fixed',next:'Next stage',complete:'Start again',intro:'Only numbers through both layers count',solved:'Perfect alignment.',how:'Only numbers visible through a hole in BOTH sheets count. Choose a sheet below, drag it on the board, or turn it by dragging the corner rotation handle. The buttons also turn by 90°.',picker:'Choose stage',close:'Close'}};
const GET=(k)=>{try{return localStorage.getItem(k)}catch{return null}},SET=(k,v)=>{try{localStorage.setItem(k,v)}catch{}};
let lang=GET(STORE+'_lang')==='en'?'en':'ja',sound=GET(STORE+'_sound')!=='false';const T=()=>TEXT[lang];
let save={unlocked:1,solved:[]};try{const s=JSON.parse(GET(STORE)||'{}');if(Number.isInteger(s.unlocked))save.unlocked=Math.min(LEVELS.length,Math.max(1,s.unlocked));if(Array.isArray(s.solved))save.solved=Array.from(new Set(s.solved.filter(i=>Number.isInteger(i)&&i>=0&&i<LEVELS.length))).sort((a,b)=>a-b)}catch{}
let stage=Math.min(save.unlocked-1,LEVELS.length-1),poses=[],selected=1,won=false,gesture=null,pointers=new Map(),audio=null,history=[];
function persist(){SET(STORE,JSON.stringify(save))}
function updateUndo(){$('undo').disabled=history.length===0}
function recordPose(previous=poses.map(p=>({...p}))){history.push({poses:previous.map(p=>({...p})),selected});if(history.length>36)history.shift();updateUndo()}
function undo(){if(!history.length||gesture)return;const prev=history.pop();poses=prev.poses.map(p=>({...p}));selected=prev.selected;won=false;$('board').classList.remove('is-won');$('equation').classList.remove('solved');drawBoard();drawChoices();drawControls();updateUndo();sfx('select')}
function audioBeep(f,d=.075,gain=.014,t=0,type='sine'){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const start=audio.currentTime+t,o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,start);g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(gain,start+.012);g.gain.exponentialRampToValueAtTime(.0001,start+d);o.connect(g).connect(audio.destination);o.start(start);o.stop(start+d+.015)}catch{}}
function sfx(k){if(k==='select')audioBeep(392,.047,.009);if(k==='slide'){audioBeep(315,.075,.013);audioBeep(465,.082,.006,.032)}if(k==='turn'){audioBeep(420,.07,.013);audioBeep(575,.12,.008,.034)}if(k==='win'){[392,493.88,587.33,783.99].forEach((f,i)=>audioBeep(f,.36,.017/(1+i*.12),i*.068));audioBeep(987.77,.35,.006,.24)} }
function has(mask,x,y){return !!(mask&(1<<(y*3+x)))}
function rotated(x,y,r){for(let i=0;i<((r%4)+4)%4;i++){const t=x;x=2-y;y=t}return[x,y]}
function positions(mask,p){const a=new Set();for(let y=0;y<3;y++)for(let x=0;x<3;x++)if(has(mask,x,y)){const [nx,ny]=rotated(x,y,p.r);a.add((ny+p.y)*4+nx+p.x)}return a}
function visible(){const lv=LEVELS[stage],a=positions(lv.masks[0],poses[0]),b=positions(lv.masks[1],poses[1]),common=[...a].filter(i=>b.has(i)).sort((a,b)=>a-b),values=common.map(i=>lv.values[i]);return {a,b,common,values,sum:values.reduce((acc,v)=>acc+v,0)}}
function coords(mask){let result=[];for(let y=0;y<3;y++)for(let x=0;x<3;x++)if(has(mask,x,y))result.push([x,y]);return result}
function svgSheet(mask,i,preview=false){const tint=i===0?'#8bc8b9':'#bbcce3',edge=i===0?'#d6fff2':'#edf5ff';const holes=coords(mask).map(([x,y])=>{let cx=50+100*x,cy=50+100*y;return `M${cx+33} ${cy} a33 33 0 1 0 -66 0 a33 33 0 1 0 66 0Z`}).join(' ');let rims=coords(mask).map(([x,y])=>`<circle cx="${50+x*100}" cy="${50+y*100}" r="33.6" stroke="${edge}" stroke-opacity="${preview?'.46':'.72'}" stroke-width="${preview?'2.4':'2.7'}" fill="none"/>`).join('');return `<svg viewBox="0 0 300 300" aria-hidden="true"><path d="M16 3 H284 Q297 3 297 16 V284 Q297 297 284 297 H16 Q3 297 3 284 V16 Q3 3 16 3Z ${holes}" fill="${tint}" fill-opacity="${preview?'.58':'.9'}" fill-rule="evenodd"/><path d="M16 3 H284 Q297 3 297 16 V284 Q297 297 284 297 H16 Q3 297 3 284 V16 Q3 3 16 3Z" fill="none" stroke="${edge}" stroke-opacity=".75" stroke-width="2.5"/><path d="M16 9H284" stroke="white" stroke-opacity=".15" stroke-width="2"/>${rims}</svg>`}
const TURN_ICON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10v-6h-6"/><path d="M20 4a8.5 8.5 0 1 0 2 11"/></svg>`;
const LEFT_ICON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10V4h6"/><path d="M4 4a8.5 8.5 0 1 1-2 11"/></svg>`;
function drawBoard(){const nums=LEVELS[stage].values;$('backnumbers').innerHTML=nums.map(v=>`<div class="number-cell"><span class="digit">${v}</span></div>`).join('');$('topnumbers').innerHTML=nums.map((v,i)=>`<div class="number-cell" data-digit="${i}"><span class="digit">${v}</span></div>`).join('');$('board').classList.remove('is-won');drawFilms();updateLight(false)}
function drawFilms(){const lv=LEVELS[stage];$('films').innerHTML=lv.masks.map((mask,i)=>{const p=poses[i],fix=!lv.rules[i].r&&!lv.rules[i].x&&!lv.rules[i].y;return `<div data-film="${i}" class="film ${i===selected?'active':''} ${fix?'locked':''}" style="--x:${p.x};--y:${p.y};--turn:${p.r*90}deg;z-index:${i===selected?4:i+1}"><div class="rotator">${svgSheet(mask,i)}<span class="stamp">${i?'B':'A'}</span></div>${lv.rules[i].r?`<div class="handle" aria-hidden="true">${TURN_ICON}</div>`:''}</div>`}).join('')}
function drawChoices(){const lv=LEVELS[stage];$('sheetrow').innerHTML=lv.masks.map((mask,i)=>{const rules=lv.rules[i],fix=!(rules.r||rules.x||rules.y);return `<button class="sheetchoice ${selected===i?'active':''} ${fix?'lock':''}" data-sheet="${i}" aria-pressed="${selected===i}" aria-label="カード${i?'B':'A'}を選択"><span class="preview">${svgSheet(mask,i,true)}</span><span><span class="name">SHEET ${i?'B':'A'}</span><span class="detail">${fix?T().locked:[rules.r?T().rotate:'',rules.x||rules.y?T().slide:''].filter(Boolean).join(' · ')}</span></span><span class="active-dot"></span></button>`}).join('');$('sheetrow').querySelectorAll('[data-sheet]').forEach(node=>node.onclick=()=>{selected=Number(node.dataset.sheet);drawChoices();syncFilm();drawControls();sfx('select')})}
function drawControls(){const r=LEVELS[stage].rules[selected];$('controls').innerHTML=won?`<button id="win-next" class="nextbtn"><span>${stage===LEVELS.length-1?T().complete:T().next}</span><span style="font-size:24px;font-weight:420">→</span></button>`:`<button id="left" class="rotate-btn" aria-label="反時計回り90度回転">${LEFT_ICON}</button><div class="control-mid"><b>SHEET ${selected?'B':'A'}</b><small>${!(r.r||r.x||r.y)?T().fixedTip:r.x||r.y?T().slideTip:T().rotateTip}</small></div><button id="right" class="rotate-btn" aria-label="時計回り90度回転">${TURN_ICON}</button>`;
if(won){$('win-next').onclick=()=>chooseStage(stage===LEVELS.length-1?0:stage+1)}else{$('left').disabled=!r.r;$('right').disabled=!r.r;$('left').onclick=()=>turn(-1);$('right').onclick=()=>turn(1)}}
function drawNav(){let lv=LEVELS[stage];$('stage-name').textContent=T().stages[stage];$('stage-index').textContent=String(stage+1).padStart(2,'0');$('target').textContent=lv.target;$('progress').style.width=(100*(stage+1)/LEVELS.length)+'%';$('prev').disabled=stage===0;$('next-stage').disabled=stage+1>=save.unlocked||stage===LEVELS.length-1;const muteIcon=$('sound').querySelector('.sound-wave');if(muteIcon)muteIcon.style.opacity=sound?'1':'0'}
function updateLight(bounce=false){const v=visible(),sum=$('sum');sum.textContent=v.sum;sum.classList.toggle('hit',v.sum===LEVELS[stage].target);if(bounce){sum.classList.remove('rebound');void sum.offsetWidth;sum.classList.add('rebound')}$('equation').innerHTML=v.values.length?`<span>${v.values.join(' + ')}</span><span>=</span><strong>${v.sum}</strong>`:`<span class="empty">${T().intro}</span>`;for(let i=0;i<16;i++){$('topnumbers').querySelector(`[data-digit="${i}"]`)?.classList.toggle('lit',v.common.includes(i))}return v}
function syncFilm(){for(let i=0;i<2;i++){const f=$('films').querySelector(`[data-film="${i}"]`);if(!f)continue;const p=poses[i];f.style.setProperty('--x',p.x);f.style.setProperty('--y',p.y);f.style.setProperty('--turn',p.r*90+'deg');f.classList.toggle('active',selected===i);f.style.zIndex=i===selected?'4':String(i+1)}}
function chooseStage(i){if(i<0||i>=LEVELS.length||i>=save.unlocked)return;stage=i;poses=[{r:0,x:0,y:0},{r:0,x:0,y:0}];let rules=LEVELS[stage].rules;selected=rules[0].r||rules[0].x||rules[0].y?0:1;won=false;gesture=null;pointers.clear();history=[];drawNav();drawBoard();drawChoices();drawControls();updateUndo()}
function celebrate(){if(won)return;const v=updateLight(true);if(v.sum!==LEVELS[stage].target)return;won=true;save.solved=Array.from(new Set([...save.solved,stage])).sort((a,b)=>a-b);save.unlocked=Math.min(LEVELS.length,Math.max(save.unlocked,stage+2));persist();drawNav();drawControls();$('board').classList.remove('is-won');void $('board').offsetWidth;$('board').classList.add('is-won');$('equation').classList.add('solved');$('equation').textContent=T().solved;v.common.forEach((i,k)=>{const cell=$('topnumbers').querySelector(`[data-digit="${i}"]`);if(cell){cell.classList.remove('burst');setTimeout(()=>cell.classList.add('burst'),k*42)}});sfx('win')}
function commitMove({soundKind='slide'}={}){syncFilm();updateLight(true);if(soundKind)sfx(soundKind);celebrate()}
function turn(dir){const rule=LEVELS[stage].rules[selected];if(won||!rule.r)return;recordPose();poses[selected].r=(poses[selected].r+dir+4)%4;commitMove({soundKind:'turn'})}
function reset(){chooseStage(stage);sfx('select')}
function boardPosition(e){let r=$('board').getBoundingClientRect();return {x:(e.clientX-r.left)/(r.width/4),y:(e.clientY-r.top)/(r.height/4),px:e.clientX,py:e.clientY,rect:r,cell:r.width/4}}
function angleAt(e,origin){return Math.atan2(e.clientY-origin.y,e.clientX-origin.x)*180/Math.PI}
function centerForPose(p,r){return{x:r.left+(p.x+1.5)*r.width/4,y:r.top+(p.y+1.5)*r.height/4}}
function canMove(rule){return rule.x||rule.y}
function chooseByBoard(t){const p=poses[selected];if(t.x>=p.x-.1&&t.x<=p.x+3.1&&t.y>=p.y-.1&&t.y<=p.y+3.1)return selected;const other=1-selected,q=poses[other];if(t.x>=q.x-.1&&t.x<=q.x+3.1&&t.y>=q.y-.1&&t.y<=q.y+3.1)return other;return selected}
function begin(e){if(won||e.pointerType==='mouse'&&e.button!==0)return;const t=boardPosition(e);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});try{e.currentTarget.setPointerCapture(e.pointerId)}catch{}
if(pointers.size>=2){if(gesture?.mode==='drag'){poses[selected].x=gesture.initialX;poses[selected].y=gesture.initialY;const f=$('films').querySelector(`[data-film="${selected}"]`);f?.classList.remove('dragging');syncFilm();updateLight(false)}const vals=[...pointers.values()].slice(0,2);const a=Math.atan2(vals[1].y-vals[0].y,vals[1].x-vals[0].x)*180/Math.PI;gesture={mode:'pinch',angle:a,initial:poses[selected].r*90};$('board').classList.add('is-moving');return}
selected=chooseByBoard(t);const rule=LEVELS[stage].rules[selected],p=poses[selected];drawChoices();syncFilm();drawControls();const origin=centerForPose(p,t.rect);const handle={x:p.x*1+2.73,y:p.y*1+.27};const inHandle=Math.hypot(t.x-handle.x,t.y-handle.y)<.46;
if(inHandle&&rule.r){gesture={mode:'rotate',pointer:e.pointerId,origin,startAngle:angleAt(e,origin),startRot:p.r*90,lastAngle:0};$('films').querySelector(`[data-film="${selected}"]`)?.classList.add('turning')}
else if(canMove(rule)){gesture={mode:'drag',pointer:e.pointerId,fromX:t.px,fromY:t.py,initialX:p.x,initialY:p.y,cell:t.cell,changed:false,lastSnap:`${p.x}:${p.y}`};$('films').querySelector(`[data-film="${selected}"]`)?.classList.add('dragging')}
else gesture={mode:'none',pointer:e.pointerId};$('board').classList.add('is-moving')}
function move(e){if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!gesture)return;
if(gesture.mode==='pinch'&&pointers.size>=2){const v=[...pointers.values()].slice(0,2),a=Math.atan2(v[1].y-v[0].y,v[1].x-v[0].x)*180/Math.PI;let d=((a-gesture.angle+540)%360)-180;gesture.degrees=d;const f=$('films').querySelector(`[data-film="${selected}"]`);if(f){f.classList.add('turning');f.style.setProperty('--turn',gesture.initial+d+'deg')}return}
if(gesture.pointer!==e.pointerId)return;
if(gesture.mode==='rotate'){let a=angleAt(e,gesture.origin),d=((a-gesture.startAngle+540)%360)-180;gesture.degrees=d;const f=$('films').querySelector(`[data-film="${selected}"]`);if(f)f.style.setProperty('--turn',gesture.startRot+d+'deg')}
if(gesture.mode==='drag'){let rule=LEVELS[stage].rules[selected],g=gesture;const dx=rule.x?(e.clientX-g.fromX)/g.cell:0,dy=rule.y?(e.clientY-g.fromY)/g.cell:0;let x=Math.max(0,Math.min(1,g.initialX+dx)),y=Math.max(0,Math.min(1,g.initialY+dy));let f=$('films').querySelector(`[data-film="${selected}"]`);if(f){f.style.setProperty('--x',x);f.style.setProperty('--y',y)}if(Math.abs(dx)+Math.abs(dy)>.06)g.changed=true;let snap=`${Math.round(x)}:${Math.round(y)}`;if(snap!==g.lastSnap){g.lastSnap=snap;poses[selected].x=Math.round(x);poses[selected].y=Math.round(y);updateLight(false)}}}
function finish(e,cancelled=false){if(!pointers.has(e.pointerId))return;pointers.delete(e.pointerId);if(!gesture)return;const g=gesture;if(g.mode==='pinch'){pointers.clear()}
if(g.mode!=='pinch'&&g.pointer!==e.pointerId)return;gesture=null;$('board').classList.remove('is-moving');const f=$('films').querySelector(`[data-film="${selected}"]`);f?.classList.remove('turning','dragging');let changed=false,kind='slide';
if(!cancelled&&(g.mode==='rotate'||g.mode==='pinch')){let r=LEVELS[stage].rules[selected];if(r.r){const dt=Math.round((g.degrees||0)/90);if(dt){let before=poses.map(p=>({...p}));before[selected].r=((g.startRot??g.initial)/90+4)%4;recordPose(before);poses[selected].r=(poses[selected].r+dt%4+4)%4;changed=true}kind='turn'}}
if(g.mode==='drag'){let p=poses[selected];const ox=p.x,oy=p.y;let bx=parseFloat(f?.style.getPropertyValue('--x')||p.x),by=parseFloat(f?.style.getPropertyValue('--y')||p.y);if(!cancelled){p.x=Math.round(Math.max(0,Math.min(1,bx)));p.y=Math.round(Math.max(0,Math.min(1,by)))}else{p.x=g.initialX;p.y=g.initialY}changed=p.x!==g.initialX||p.y!==g.initialY;if(changed){const before=poses.map(p=>({...p}));before[selected].x=g.initialX;before[selected].y=g.initialY;recordPose(before)}}
syncFilm();updateLight(changed);if(changed){sfx(kind);celebrate()}}
function showPicker(){let host=$('modalhost');host.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="${T().picker}"><div class="dialog"><div class="dialog-head"><strong>${T().picker}</strong><button id="closepicker" aria-label="${T().close}">×</button></div><div class="gridnav">${LEVELS.map((_,i)=>`<button class="levelbtn ${i===stage?'active':''} ${save.solved.includes(i)?'done':''}" data-level="${i}" ${i>=save.unlocked?'disabled':''}>${String(i+1).padStart(2,'0')}</button>`).join('')}</div><button id="donepicker" class="dialog-action">${T().close}</button></div></div>`;const shut=()=>host.innerHTML='';$('closepicker').onclick=shut;$('donepicker').onclick=shut;host.querySelector('.modal').onclick=e=>{if(e.target.classList.contains('modal'))shut()};host.querySelectorAll('[data-level]').forEach(btn=>btn.onclick=()=>{const n=Number(btn.dataset.level);shut();chooseStage(n);sfx('select')})}
function showHelp(){let host=$('modalhost');host.innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="dialog"><div class="dialog-head"><strong>${lang==='ja'?'遊びかた':'HOW TO PLAY'}</strong><button id="closehelp">×</button></div><p>${T().how}</p><button id="donehelp" class="dialog-action">${T().close}</button><button id="language" class="dialog-action secondary">${lang==='ja'?'English':'日本語'}</button></div></div>`;const shut=()=>host.innerHTML='';$('closehelp').onclick=shut;$('donehelp').onclick=shut;$('language').onclick=()=>{lang=lang==='ja'?'en':'ja';SET(STORE+'_lang',lang);shut();chooseStage(stage);showHelp()};host.querySelector('.modal').onclick=e=>{if(e.target.classList.contains('modal'))shut()}}
$('undo').onclick=undo;$('reset').onclick=reset;$('sound').onclick=()=>{sound=!sound;SET(STORE+'_sound',String(sound));drawNav();if(sound)sfx('select')};$('prev').onclick=()=>{chooseStage(stage-1);sfx('select')};$('next-stage').onclick=()=>{chooseStage(stage+1);sfx('select')};$('stage-pick').onclick=showPicker;$('help').onclick=showHelp;
$('drag-layer').addEventListener('pointerdown',begin);$('drag-layer').addEventListener('pointermove',move);$('drag-layer').addEventListener('pointerup',finish);$('drag-layer').addEventListener('pointercancel',e=>finish(e,true));$('drag-layer').addEventListener('lostpointercapture',e=>{if(pointers.has(e.pointerId))finish(e,true)});
document.addEventListener('keydown',e=>{if($('modalhost').children.length){if(e.key==='Escape')$('modalhost').innerHTML='';return}if(['a','A','b','B'].includes(e.key)){selected=e.key.toLowerCase()==='a'?0:1;drawChoices();syncFilm();drawControls();return}if(e.key==='r'||e.key==='R'){turn(e.shiftKey?-1:1);return}if(e.key.startsWith('Arrow')){let rule=LEVELS[stage].rules[selected],p=poses[selected],old=`${p.x},${p.y}`;if(e.key==='ArrowLeft'&&rule.x)p.x=0;else if(e.key==='ArrowRight'&&rule.x)p.x=1;else if(e.key==='ArrowUp'&&rule.y)p.y=0;else if(e.key==='ArrowDown'&&rule.y)p.y=1;else return;e.preventDefault();if(`${p.x},${p.y}`!==old){const before=poses.map(p=>({...p}));[before[selected].x,before[selected].y]=old.split(',').map(Number);recordPose(before);commitMove({soundKind:'slide'})}}});
function verify(){const states=r=>{let arr=[];for(let t=0;t<(r.r?4:1);t++)for(let x=0;x<(r.x?2:1);x++)for(let y=0;y<(r.y?2:1);y++)arr.push({r:t,x,y});return arr};for(let [idx,l] of LEVELS.entries()){let c=0;for(let a of states(l.rules[0]))for(let b of states(l.rules[1])){const A=positions(l.masks[0],a),B=positions(l.masks[1],b);let sum=0;for(let p of A)if(B.has(p))sum+=l.values[p];if(sum===l.target)c++}if(c<1||c>3)throw Error(`Stage ${idx+1} has ${c} solutions`)}}
try{verify();chooseStage(stage)}catch(err){console.error(err);$('board').innerHTML='<p style="padding:20px">Problem verification failed.</p>'}
</script>
