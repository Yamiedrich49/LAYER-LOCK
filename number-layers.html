const LEVELS=[{"tag":"TURN","values":[2,3,4,5,1,8,2,8,7,6,3,1,7,6,9,9],"masks":[243,111],"target":15,"rules":[{"r":false,"x":false,"y":false},{"r":true,"x":false,"y":false}]},{"tag":"SLIDE","values":[9,1,8,7,6,3,1,2,5,8,4,9,3,4,2,5],"masks":[499,474],"target":16,"rules":[{"r":false,"x":false,"y":false},{"r":false,"x":true,"y":false}]},{"tag":"SHIFT","values":[4,4,6,5,8,1,5,8,7,3,2,2,3,6,1,7],"masks":[188,466],"target":17,"rules":[{"r":false,"x":false,"y":false},{"r":true,"x":true,"y":true}]},{"tag":"TWO TURNS","values":[6,2,5,8,7,4,1,1,3,8,9,6,5,2,3,7],"masks":[459,310],"target":21,"rules":[{"r":true,"x":false,"y":false},{"r":true,"x":true,"y":true}]},{"tag":"CROSS","values":[3,7,1,2,2,5,3,8,4,1,6,9,7,8,6,9],"masks":[467,376],"target":23,"rules":[{"r":true,"x":true,"y":false},{"r":true,"x":true,"y":true}]},{"tag":"COVER","values":[8,3,2,9,4,3,6,5,7,9,5,1,2,4,8,6],"masks":[126,55],"target":25,"rules":[{"r":true,"x":true,"y":true},{"r":true,"x":true,"y":true}]},{"tag":"OFFSET","values":[8,5,7,5,9,4,9,8,3,6,1,2,4,7,2,1],"masks":[436,488],"target":26,"rules":[{"r":true,"x":true,"y":true},{"r":true,"x":true,"y":true}]},{"tag":"MIRROR","values":[2,4,7,2,9,5,1,8,3,7,8,5,6,9,6,4],"masks":[62,121],"target":27,"rules":[{"r":true,"x":true,"y":true},{"r":true,"x":true,"y":true}]},{"tag":"BALANCE","values":[3,9,8,9,4,2,7,5,8,1,2,1,3,4,7,6],"masks":[499,91],"target":30,"rules":[{"r":true,"x":true,"y":true},{"r":true,"x":true,"y":true}]},{"tag":"MASTER","values":[1,4,7,5,8,3,7,9,6,9,1,4,8,2,5,3],"masks":[249,466],"target":29,"rules":[{"r":true,"x":true,"y":true},{"r":true,"x":true,"y":true}]}];

let save={unlocked:1,solved:[]};try{const v=JSON.parse(GET(STORE)||'{}');if(Number.isInteger(v.unlocked))save.unlocked=Math.min(LEVELS.length,Math.max(1,v.unlocked));if(Array.isArray(v.solved))save.solved=Array.from(new Set(v.solved.filter(i=>Number.isInteger(i)&&i>=0&&i<LEVELS.length))).sort((a,b)=>a-b)}catch{}

function beep(freq,d=.09,vol=.014,delay=0){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const t=audio.currentTime+delay,o=audio.createOscillator(),g=audio.createGain();o.type='sine';o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+d+.015)}catch{}}

function positions(mask,p){const found=new Set();for(let y=0;y<3;y++)for(let x=0;x<3;x++)if(has(mask,x,y)){const [nx,ny]=rotateCell(x,y,p.r);found.add((ny+p.y)*4+nx+p.x)}return found}
function solve(){const l=LEVELS[stage],a=positions(l.masks[0],poses[0]),b=positions(l.masks[1],poses[1]),common=[...a].filter(i=>b.has(i)).sort((x,y)=>x-y);return{common,sum:common.reduce((t,i)=>t+l.values[i],0)}}
function validRule(r){let p=[];for(let angle=0;angle<(r.r?4:1);angle++)for(let x=0;x<(r.x?2:1);x++)for(let y=0;y<(r.y?2:1);y++)p.push({r:angle,x,y});return p}
function validate(){LEVELS.forEach((l,i)=>{let count=0;for(const a of validRule(l.rules[0]))for(const b of validRule(l.rules[1])){let aa=positions(l.masks[0],a),bb=positions(l.masks[1],b),sum=0;for(let p of aa)if(bb.has(p))sum+=l.values[p];if(sum===l.target)count++}if(count<1||count>3)throw Error('stage '+(i+1)+' solutions: '+count)})}
function sheetSvg(mask,id){const col=id===0?'#85c8b4':'#bbcfe4',c2=id===0?'#a7decf':'#d4e1f1',holes=[];for(let y=0;y<3;y++)for(let x=0;x<3;x++)if(has(mask,x,y)){const cx=16.6667+33.3333*x,cy=16.6667+33.3333*y,r=10.25;holes.push(`M${(cx+r).toFixed(3)} ${cy.toFixed(3)}a${r} ${r} 0 1 0 ${-2*r} 0a${r} ${r} 0 1 0 ${2*r} 0Z`)}return `<svg viewBox="0 0 100 100" role="img" aria-label="紙 ${'AB'[id]}"><path d="M7 0H93Q100 0 100 7V93Q100 100 93 100H7Q0 100 0 93V7Q0 0 7 0Z ${holes.join(' ')}" fill="${col}" fill-rule="evenodd" fill-opacity=".95"/><path d="M7 .5H93Q99.5 .5 99.5 7V93Q99.5 99.5 93 99.5H7Q.5 99.5 .5 93V7Q.5 .5 7 .5Z" fill="none" stroke="${c2}" stroke-opacity=".8"/><path d="M8 8h7M8 8v7" stroke="#436d69" stroke-width=".8" opacity=".65"/></svg>`}
const TURNICON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.7"><path d="M20 11a8 8 0 1 1-3.5-6.5M20 4v7h-7"/></svg>`;
function makeTray(id){const l=LEVELS[stage],rule=l.rules[id],p=poses[id];const editable=rule.r||rule.x||rule.y;return `<div class="tray ${editable?'':'locked'}" data-id="${id}"><div class="tray-top"><span class="tray-name">${'AB'[id]}</span><span class="tray-status">${editable?(rule.x||rule.y?T().slide:'')+(rule.r&&(rule.x||rule.y)?' + ':'')+(rule.r?T().rotate:''):T().locked}</span></div><div class="tray-pad" data-pad="${id}" tabindex="0" role="group" aria-label="紙 ${'AB'[id]} の準備エリア"><div class="ghostgrid">${'<i></i>'.repeat(16)}</div><div class="paper ${editable?'':'fixed'}" data-paper="${id}" style="--x:${p.x};--y:${p.y};--angle:${p.r*90}deg"><div class="face">${sheetSvg(l.masks[id],id)}</div>${rule.r?`<div class="turn-handle" data-turn-handle="${id}" aria-hidden="true">${TURNICON}</div>`:''}</div></div><div class="tray-bottom"><button class="microbtn" data-rotate="${id}" data-dir="-1" aria-label="紙${'AB'[id]}を左に回す" ${!rule.r?'disabled':''}>↶</button><span class="tray-degrees" data-angle="${id}">${rule.r?p.r*90+'°':T().locked}</span><button class="microbtn" data-rotate="${id}" data-dir="1" aria-label="紙${'AB'[id]}を右に回す" ${!rule.r?'disabled':''}>↷</button></div></div>`}
function paintTrays(){$('trays').innerHTML=makeTray(0)+makeTray(1)}
function syncTray(id){const p=poses[id],el=document.querySelector(`[data-paper="${id}"]`);if(!el)return;el.style.setProperty('--x',p.x);el.style.setProperty('--y',p.y);el.style.setProperty('--angle',p.r*90+'deg');const a=document.querySelector(`[data-angle="${id}"]`);if(a&&LEVELS[stage].rules[id].r)a.textContent=p.r*90+'°'}
function clearResult(){if(won||busy)return;$('sum').textContent='?';$('sum').className='';$('equation').textContent='';$('equation').classList.remove('success');$('number-board').classList.remove('revealed','good','is-revealing');$('numbers').querySelectorAll('.number').forEach(c=>c.classList.remove('hit'));$('light').innerHTML=''}
function updateNav(){const l=LEVELS[stage];$('stage-label').textContent=String(stage+1).padStart(2,'0')+' · '+(lang==='ja'?T().stages[stage]:l.tag);$('picker').textContent=String(stage+1).padStart(2,'0')+' / 10';$('prev').disabled=stage===0;$('next').disabled=stage+1>=save.unlocked||stage>=9;$('progress').style.width=(stage+1)*10+'%';$('target').textContent=l.target;$('undo').disabled=busy||won||history.length===0;$('reset').disabled=busy;$('sound').querySelectorAll('.wave').forEach(e=>e.style.opacity=sound?'1':'.13');$('go-label').textContent=won?(stage===9?T().retry:T().next):T().go;$('go').disabled=busy;$('goal-label').textContent=T().goal;$('sum-label').textContent=T().sum;$('board-caption').textContent=T().board;$('prepare-label').textContent=T().prep;$('prepare-note').textContent=T().note;$('help').textContent=T().help}
function chooseStage(i){if(i<0||i>=LEVELS.length||i>=save.unlocked)return;cancelFlight();stage=i;poses=[{r:0,x:0,y:0},{r:0,x:0,y:0}];history=[];won=false;busy=false;gesture=null;const l=LEVELS[stage];$('numbers').innerHTML=l.values.map((v,i)=>`<div class="number" data-cell="${i}">${v}</div>`).join('');paintTrays();clearResult();updateNav()}
function pushHistory(before){history.push(before.map(p=>({...p})));if(history.length>40)history.shift();updateNav()}
function turn(id,delta){if(busy||won||!LEVELS[stage].rules[id].r)return;const before=poses.map(p=>({...p}));poses[id].r=(poses[id].r+delta+4)%4;if(poses[id].r===before[id].r)return;pushHistory(before);syncTray(id);clearResult();sfx('turn')}
function undo(){if(busy||won||gesture||!history.length)return;poses=history.pop().map(p=>({...p}));for(let i=0;i<2;i++)syncTray(i);clearResult();updateNav();sfx('pick')}
function reset(){if(busy)return;chooseStage(stage);sfx('pick')}
function angle(e,origin){return Math.atan2(e.clientY-origin.y,e.clientX-origin.x)*180/Math.PI}
function down(e){if(busy||won||(e.pointerType==='mouse'&&e.button!==0))return;const pad=e.target.closest('[data-pad]');if(!pad)return;const id=Number(pad.dataset.pad),r=LEVELS[stage].rules[id],paper=pad.querySelector('.paper');if(!r.r&&!r.x&&!r.y)return;const rect=paper.getBoundingClientRect();if(e.target.closest('[data-turn-handle]')&&r.r){let origin={x:rect.left+rect.width/2,y:rect.top+rect.height/2};gesture={id,mode:'turn',pointer:e.pointerId,angle:angle(e,origin),origin,start:poses[id].r*90,delta:0};paper.classList.add('rotating')}else if(r.x||r.y){const rr=pad.getBoundingClientRect();gesture={id,mode:'drag',pointer:e.pointerId,startX:e.clientX,startY:e.clientY,x:poses[id].x,y:poses[id].y,cell:rr.width/4,dx:0,dy:0};paper.classList.add('moving')}else return;try{pad.setPointerCapture(e.pointerId)}catch{};e.preventDefault()}
function move(e){if(!gesture||e.pointerId!==gesture.pointer)return;const g=gesture,pp=document.querySelector(`[data-paper="${g.id}"]`);if(!pp)return;if(g.mode==='turn'){const d=((angle(e,g.origin)-g.angle+540)%360)-180;g.delta=d;pp.style.setProperty('--angle',g.start+d+'deg')}else{const rule=LEVELS[stage].rules[g.id];g.dx=rule.x?(e.clientX-g.startX)/g.cell:0;g.dy=rule.y?(e.clientY-g.startY)/g.cell:0;pp.style.setProperty('--x',Math.max(0,Math.min(1,g.x+g.dx)));pp.style.setProperty('--y',Math.max(0,Math.min(1,g.y+g.dy)))}e.preventDefault()}
function up(e,cancel=false){if(!gesture||gesture.pointer!==e.pointerId)return;const g=gesture;gesture=null;const pp=document.querySelector(`[data-paper="${g.id}"]`);pp?.classList.remove('rotating','moving');const before=poses.map(p=>({...p}));if(!cancel){if(g.mode==='turn'){poses[g.id].r=(poses[g.id].r+Math.round(g.delta/90)+8)%4}else{poses[g.id].x=Math.round(Math.max(0,Math.min(1,g.x+g.dx)));poses[g.id].y=Math.round(Math.max(0,Math.min(1,g.y+g.dy)))}}const changed=Object.keys(before[g.id]).some(k=>before[g.id][k]!==poses[g.id][k]);if(changed){pushHistory(before);sfx(g.mode==='turn'?'turn':'move');clearResult()}syncTray(g.id);e.preventDefault()}
function wait(t){return new Promise(resolve=>setTimeout(resolve,t))}
function cancelFlight(){runId++;for(const n of flightNodes){for(const a of n.getAnimations())a.cancel();n.remove()}flightNodes=[]}
function cloneFlight(id){const source=document.querySelector(`[data-paper="${id}"]`),rect=source.getBoundingClientRect(),el=document.createElement('div');el.className='flight';el.style.cssText=`left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;height:${rect.height}px;z-index:${60+id}`;el.innerHTML=`<div class="face" style="transform:rotate(${poses[id].r*90}deg)">${sheetSvg(LEVELS[stage].masks[id],id)}</div>`;document.body.appendChild(el);flightNodes.push(el);return{el,rect}}
function flightPath(f,id,reverse=false){const board=$('number-board').getBoundingClientRect(),p=poses[id];const finalX=board.left+p.x*board.width/4,finalY=board.top+p.y*board.height/4,size=board.width*.75;const dx=finalX-f.rect.left,dy=finalY-f.rect.top,scale=size/f.rect.width;const start='translate(0px,0px) scale(1)';const lift=`translate(${dx*.48}px,${dy*.48-18}px) scale(${1+(scale-1)*.48})`;const end=`translate(${dx}px,${dy}px) scale(${scale})`;return reverse?[{transform:end},{transform:lift,offset:.48},{transform:start}]:[{transform:start},{transform:lift,offset:.48},{transform:end}]}
async function fly(f,id,reverse=false,delay=0){if(delay)await wait(delay);const a=f.el.animate(flightPath(f,id,reverse),{duration:reverse?320:440,easing:'cubic-bezier(.2,.78,.22,1)',fill:'forwards'});await a.finished.catch(()=>{});return a}
function showResult(data){const l=LEVELS[stage],board=$('number-board');board.classList.add('revealed');board.classList.remove('is-revealing');$('sum').textContent=data.sum;$('sum').className=data.sum===l.target?'success':'miss';$('equation').innerHTML=data.common.length?data.common.map(i=>l.values[i]).join(' + ')+` = <b>${data.sum}</b>`:lang==='ja'?'重なった穴はありません':'No shared holes';$('equation').classList.toggle('success',data.sum===l.target);for(const id of data.common){$('numbers').querySelector(`[data-cell="${id}"]`)?.classList.add('hit')}const on=new Set(data.common);$('light').innerHTML=Array.from({length:16},(_,i)=>`<span class="glow ${on.has(i)?'on':''}"></span>`).join('');if(data.sum===l.target)board.classList.add('good')}
async function check(){if(busy||won)return;busy=true;updateNav();const run=++runId;const data=solve(),good=data.sum===LEVELS[stage].target;const f0=cloneFlight(0),f1=cloneFlight(1);$('number-board').classList.add('is-revealing');const p0=fly(f0,0,false,0),p1=fly(f1,1,false,110);await Promise.all([p0,p1]);if(run!==runId)return;sfx('land');showResult(data);if(good){won=true;save.solved=Array.from(new Set([...save.solved,stage])).sort((a,b)=>a-b);save.unlocked=Math.min(LEVELS.length,Math.max(save.unlocked,stage+2));saveProgress();sfx('win');busy=false;updateNav();return}await wait(1000);if(run!==runId)return;sfx('miss');await Promise.all([fly(f0,0,true),fly(f1,1,true,60)]);if(run!==runId)return;cancelFlight();busy=false;clearResult();updateNav()}
function modal(html){$('modalhost').innerHTML=`<div class="modal" role="dialog" aria-modal="true"><div class="dialog">${html}</div></div>`;$('modalhost').querySelector('.modal').addEventListener('click',e=>{if(e.target.classList.contains('modal'))$('modalhost').innerHTML=''})}
function picker(){modal(`<div class="dialog-top"><b>${T().choose}</b><button data-close aria-label="${T().close}">×</button></div><div class="gridnav">${LEVELS.map((_,i)=>`<button class="lev ${stage===i?'active':''} ${save.solved.includes(i)?'done':''}" data-stage="${i}" ${i>=save.unlocked?'disabled':''}>${String(i+1).padStart(2,'0')}</button>`).join('')}</div><button class="close" data-close>${T().close}</button>`)}
function help(){modal(`<div class="dialog-top"><b>${T().help}</b><button data-close aria-label="${T().close}">×</button></div><p>${T().how}</p><button class="close" data-close>${T().close}</button><button class="lang" data-lang>${lang==='ja'?'English':'日本語'}</button>`)}
$('undo').addEventListener('click',undo);$('reset').addEventListener('click',reset);$('prev').addEventListener('click',()=>chooseStage(stage-1));$('next').addEventListener('click',()=>chooseStage(stage+1));$('picker').addEventListener('click',picker);$('help').addEventListener('click',help);$('sound').addEventListener('click',()=>{sound=!sound;SET(STORE+'_sound',String(sound));updateNav();if(sound)sfx('pick')});$('go').addEventListener('click',()=>won?chooseStage(stage===9?0:stage+1):check());
$('trays').addEventListener('click',e=>{const b=e.target.closest('[data-rotate]');if(b)turn(Number(b.dataset.rotate),Number(b.dataset.dir))});$('trays').addEventListener('pointerdown',down);$('trays').addEventListener('pointermove',move);$('trays').addEventListener('pointerup',e=>up(e));$('trays').addEventListener('pointercancel',e=>up(e,true));$('trays').addEventListener('lostpointercapture',e=>{if(gesture?.pointer===e.pointerId)up(e,true)});
$('modalhost').addEventListener('click',e=>{const close=e.target.closest('[data-close]'),stageBtn=e.target.closest('[data-stage]');if(close){$('modalhost').innerHTML='';return}if(stageBtn){const i=Number(stageBtn.dataset.stage);$('modalhost').innerHTML='';chooseStage(i);return}if(e.target.closest('[data-lang]')){lang=lang==='ja'?'en':'ja';SET(STORE+'_lang',lang);$('modalhost').innerHTML='';chooseStage(stage);help()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('modalhost').innerHTML='';if(['a','A','b','B'].includes(e.key)&&!busy){document.querySelector(`[data-pad="${e.key.toLowerCase()==='a'?0:1}"]`)?.focus()}if(e.key==='Enter'&&!$('modalhost').children.length&&document.activeElement===document.body){check()}});
try{validate();chooseStage(stage)}catch(e){console.error(e);$('number-board').innerHTML=`<p style="padding:15px">問題データを確認できません: ${e.message}</p>`}
</script></body></html>
