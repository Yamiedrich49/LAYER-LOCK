function storeGet(key){try{return localStorage.getItem(key)}catch{return null}}function storeSet(key,value){try{localStorage.setItem(key,value)}catch{}}

const T=()=>strings[lang]||strings.ja;

let stage=Math.min(save.unlocked-1,LEVELS.length-1),poses=[],selected=1,win=false,drag=null,ac=null,sfxCooldown=0;

function beep(freq=480,duration=.065,vol=.012,delay=0){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let time=ac.currentTime+delay;const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(freq,time);g.gain.setValueAtTime(.0001,time);g.gain.exponentialRampToValueAtTime(vol,time+.009);g.gain.exponentialRampToValueAtTime(.0001,time+duration);o.connect(g).connect(ac.destination);o.start(time);o.stop(time+duration+.015)}catch{}}

function has(mask,x,y){return ((mask>>(y*3+x))&1)===1}
function rotateXY(x,y,t){for(let i=0;i<t;i++){const v=x;x=2-y;y=v}return [x,y]}
function sheetPositions(mask,pose){const pts=new Set();for(let y=0;y<3;y++)for(let x=0;x<3;x++)if(has(mask,x,y)){const [a,b]=rotateXY(x,y,pose.r);pts.add((b+pose.y)*4+(a+pose.x))}return pts}
function visible(){const level=LEVELS[stage],a=sheetPositions(level.masks[0],poses[0]),b=sheetPositions(level.masks[1],poses[1]),common=[...a].filter(i=>b.has(i)).sort((x,y)=>x-y),values=common.map(i=>level.values[i]);return {a,b,common,values,sum:values.reduce((u,v)=>u+v,0)}}

function sheetSVG(mask,i,small=false){const tint=i===0?'#7cbeaf':'#a2b4d8',line=i===0?'#b4ecdc':'#d4dfff';const id=(small?'mini':'main')+'mask'+i;let circles=allMaskCenters(mask).map(([x,y])=>`<circle cx="${50+x*100}" cy="${50+y*100}" r="32"/>`).join('');return `<svg viewBox="0 0 300 300" aria-hidden="true"><defs><mask id="${id}"><rect width="300" height="300" fill="white"/>${circles.replaceAll('<circle','<circle fill="black"')}</mask></defs><rect x="1.5" y="1.5" width="297" height="297" rx="14" fill="${tint}" fill-opacity="${small?'.25':'.38'}" stroke="${line}" stroke-opacity=".85" stroke-width="3" mask="url(#${id})"/>${allMaskCenters(mask).map(([x,y])=>`<circle cx="${50+x*100}" cy="${50+y*100}" r="32" fill="none" stroke="${line}" stroke-opacity="${small?'.5':'.58'}" stroke-width="3"/>`).join('')}<rect x="2" y="2" width="296" height="296" rx="13" fill="none" stroke="${line}" stroke-opacity=".4" stroke-width="3"/></svg>`}
function drawFilms(){let html='';for(let i=0;i<2;i++){const p=poses[i];html+=`<div class="film ${selected===i?'selected':''}" data-film="${i}" style="--x:${p.x};--y:${p.y};--turn:${p.r*90}deg;z-index:${selected===i?4:i+1}">${sheetSVG(LEVELS[stage].masks[i],i)}<div class="pin">${i===0?'A':'B'}</div></div>`} $('films').innerHTML=html}
function updateFilm(){for(let i=0;i<2;i++){const f=document.querySelector(`[data-film="${i}"]`);if(!f)continue;const p=poses[i];f.style.setProperty('--x',p.x);f.style.setProperty('--y',p.y);f.style.setProperty('--turn',p.r*90+'deg');f.classList.toggle('selected',selected===i);f.style.zIndex=selected===i?'4':(i+1)}}
function drawNumbers(){const lv=LEVELS[stage];$('backnumbers').innerHTML=lv.values.map(()=>'<div class="cell"></div>').join('');$('topnumbers').innerHTML=lv.values.map((v,i)=>`<div class="cell" data-cell="${i}"><span class="digit">${v}</span><div class="channels"><i></i><i></i></div></div>`).join('')}
function refresh(){let v=visible();$('sum').textContent=v.sum;$('sum').classList.toggle('hit',v.sum===LEVELS[stage].target);$('equation').innerHTML=v.values.length?`<span>${v.values.join(' + ')} = </span><strong>${v.sum}</strong>`:`<span class="empty">${T().intro}</span>`;for(let i=0;i<16;i++){const cell=document.querySelector(`[data-cell="${i}"]`);if(!cell)continue;cell.classList.toggle('illuminated',v.common.includes(i));cell.querySelectorAll('.channels i').forEach((pip,k)=>pip.classList.toggle('on',k===0?v.a.has(i):v.b.has(i)))}return v}
function drawChoices(){const l=LEVELS[stage];$('sheetrow').innerHTML=l.masks.map((mask,i)=>{const rules=l.rules[i],fix=!rules.r&&!rules.x&&!rules.y;return `<button class="sheetchoice ${selected===i?'active':''} ${fix?'lock':''}" data-sheet="${i}" aria-label="${i===0?'A':'B'}の紙を選ぶ">${sheetSVG(mask,i,true)}<div><div class="ident">${i?'B':'A'}</div><div class="state">${fix?T().locked:`${rules.r?T().rotate:''}${rules.r&&(rules.x||rules.y)?' · ':''}${rules.x||rules.y?T().slide:''}`}</div></div><span class="selmark"></span></button>`}).join('');$('sheetrow').querySelectorAll('[data-sheet]').forEach(el=>el.addEventListener('click',()=>{selected=Number(el.dataset.sheet);drawChoices();updateFilm();refreshControls();sfx('tap')}))}
function refreshControls(){const r=LEVELS[stage].rules[selected];let msg=!(r.r||r.x||r.y)?T().fixed:r.x||r.y?T().drag:T().rotateTip;$('controls').innerHTML='';if(win){const b=document.createElement('button');b.className='nextbtn';b.id='win-next';b.innerHTML=`<span>${stage===LEVELS.length-1?T().complete:T().next}</span><span>→</span>`;b.addEventListener('click',()=>{sfx('tap');if(stage===LEVELS.length-1)selectStage(0);else selectStage(stage+1)});$('controls').appendChild(b)}else{$('controls').innerHTML=`<button id="left" class="rotbtn" aria-label="左に90度回転"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4.2 10.2A8 8 0 1 1 4 14.2M4 4v6.2h6.2"/></svg></button><div class="control-mid"><b id="control-label">SHEET ${selected?'B':'A'}</b><small id="control-tip">${msg}</small></div><button id="right" class="rotbtn" aria-label="右に90度回転"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M19.8 10.2A8 8 0 1 0 20 14.2M20 4v6.2h-6.2"/></svg></button>`;$('left').disabled=!r.r;$('right').disabled=!r.r;$('left').addEventListener('click',()=>turn(-1));$('right').addEventListener('click',()=>turn(1))}}
function refreshNav(){const label=T().stage[stage];$('stage-name').textContent=label;$('stage-index').textContent=String(stage+1).padStart(2,'0');$('progress').style.width=100*(stage+1)/LEVELS.length+'%';$('prev').disabled=stage===0;$('next-stage').disabled=stage+1>=save.unlocked||stage===LEVELS.length-1;$('target').textContent=LEVELS[stage].target;$('sound').querySelector('.sound-wave').style.opacity=sound?'1':'0'}
function selectStage(i){if(i<0||i>=LEVELS.length||i>=save.unlocked)return;stage=i;poses=[{r:0,x:0,y:0},{r:0,x:0,y:0}];selected=LEVELS[stage].rules[0].r||LEVELS[stage].rules[0].x||LEVELS[stage].rules[0].y?0:1;win=false;drag=null;refreshNav();drawNumbers();drawFilms();drawChoices();refreshControls();refresh()}
function testWin(){if(win)return;const v=refresh();if(v.sum!==LEVELS[stage].target)return;win=true;save.solved=[...new Set([...save.solved,stage])].sort((a,b)=>a-b);save.unlocked=Math.min(LEVELS.length,Math.max(save.unlocked,stage+2));persist();refreshNav();refreshControls();$('board').classList.remove('success-fade');void $('board').offsetWidth;$('board').classList.add('success-fade');sfx('win')}
function turn(d){if(win||!LEVELS[stage].rules[selected].r)return;const p=poses[selected];p.r=(p.r+d+4)%4;updateFilm();drawChoices();sfx('rotate');testWin()}
function reset(){selectStage(stage);sfx('tap')}
const board=$('board');function down(e){if(win)return;if(e.pointerType==='mouse'&&e.button!==0)return;const r=LEVELS[stage].rules[selected];if(!r.x&&!r.y)return;let bbox=board.getBoundingClientRect();let cell=bbox.width/4;let p=poses[selected];const cx=(e.clientX-bbox.left)/cell,cy=(e.clientY-bbox.top)/cell;if(cx<p.x-.15||cx>p.x+3.15||cy<p.y-.15||cy>p.y+3.15)return;drag={pointer:e.pointerId,startX:e.clientX,startY:e.clientY,px:p.x,py:p.y,cell,changed:false};try{e.currentTarget.setPointerCapture(e.pointerId)}catch{};document.querySelector(`[data-film="${selected}"]`)?.classList.add('dragging')}
function move(e){if(!drag||drag.pointer!==e.pointerId)return;const rules=LEVELS[stage].rules[selected];const dx=rules.x?(e.clientX-drag.startX)/drag.cell:0,dy=rules.y?(e.clientY-drag.startY)/drag.cell:0;const x=Math.min(1,Math.max(0,drag.px+dx)),y=Math.min(1,Math.max(0,drag.py+dy));const film=document.querySelector(`[data-film="${selected}"]`);if(film){film.style.setProperty('--x',x);film.style.setProperty('--y',y)}if(Math.abs(dx)+Math.abs(dy)>.14)drag.changed=true}
function up(e){if(!drag||drag.pointer!==e.pointerId)return;const rules=LEVELS[stage].rules[selected],d=drag;drag=null;const dx=rules.x?(e.clientX-d.startX)/d.cell:0,dy=rules.y?(e.clientY-d.startY)/d.cell:0;const x=Math.round(Math.min(1,Math.max(0,d.px+dx))),y=Math.round(Math.min(1,Math.max(0,d.py+dy))),p=poses[selected];const changed=p.x!==x||p.y!==y;p.x=x;p.y=y;document.querySelector(`[data-film="${selected}"]`)?.classList.remove('dragging');updateFilm();if(changed){sfx('slide');testWin()}else refresh()}
function cancel(e){if(!drag||drag.pointer!==e.pointerId)return;drag=null;document.querySelector('.film.dragging')?.classList.remove('dragging');updateFilm()}
function showPicker(){const host=$('modalhost');host.innerHTML=`<div class="modal" role="dialog" aria-label="${T().stagePicker}"><div class="dialog"><div class="dialog-head"><b>${T().stagePicker}</b><button id="closex" class="iconbtn" aria-label="${T().close}">✕</button></div><div class="gridnav">${LEVELS.map((_,i)=>`<button class="levelbtn ${i===stage?'active':''} ${save.solved.includes(i)?'done':''} ${i>=save.unlocked?'locked':''}" data-pick="${i}" ${i>=save.unlocked?'disabled':''}>${String(i+1).padStart(2,'0')}</button>`).join('')}</div><button id="dismiss" class="dismiss">${T().close}</button></div></div>`;host.querySelector('#closex').onclick=()=>host.innerHTML='';host.querySelector('#dismiss').onclick=()=>host.innerHTML='';host.querySelector('.modal').addEventListener('click',e=>{if(e.target.classList.contains('modal'))host.innerHTML=''});host.querySelectorAll('[data-pick]').forEach(btn=>btn.onclick=()=>{host.innerHTML='';selectStage(Number(btn.dataset.pick));sfx('tap')})}
function help(){const host=$('modalhost');host.innerHTML=`<div class="modal" role="dialog"><div class="dialog"><div class="dialog-head"><b>${lang==='ja'?'遊びかた':'HOW TO PLAY'}</b><button id="closehelp" class="iconbtn">✕</button></div><p style="font-size:14px;line-height:1.85;color:#bcdad4;margin:22px 0 16px">${T().instruction}</p><button id="dismisshelp" class="dismiss">${T().close}</button><button id="lang" class="dismiss" style="margin-top:7px;background:transparent;border:1px solid #375961">${lang==='ja'?'English':'日本語'}</button></div></div>`;host.querySelector('#closehelp').onclick=host.querySelector('#dismisshelp').onclick=()=>host.innerHTML='';host.querySelector('#lang').onclick=()=>{lang=lang==='ja'?'en':'ja';storeSet(STORE+'_lang',lang);host.innerHTML='';selectStage(stage);help()}}
$('reset').addEventListener('click',reset);$('sound').addEventListener('click',()=>{sound=!sound;storeSet(STORE+'_sound',String(sound));refreshNav();if(sound)sfx('tap')});$('prev').addEventListener('click',()=>{selectStage(stage-1);sfx('tap')});$('next-stage').addEventListener('click',()=>{selectStage(stage+1);sfx('tap')});$('stage-pick').addEventListener('click',showPicker);$('help').addEventListener('click',help);$('drag-layer').addEventListener('pointerdown',down);$('drag-layer').addEventListener('pointermove',move);$('drag-layer').addEventListener('pointerup',up);$('drag-layer').addEventListener('pointercancel',cancel);
document.addEventListener('keydown',e=>{if($('modalhost').children.length){if(e.key==='Escape')$('modalhost').innerHTML='';return}if(e.key==='a'||e.key==='A'){selected=0;drawChoices();updateFilm();refreshControls()}if(e.key==='b'||e.key==='B'){selected=1;drawChoices();updateFilm();refreshControls()}if(e.key==='r'||e.key==='R'){turn(e.shiftKey?-1:1)}if(e.key.startsWith('Arrow')){const r=LEVELS[stage].rules[selected],p=poses[selected];let x=p.x,y=p.y;if(e.key==='ArrowLeft'&&r.x)x=0;else if(e.key==='ArrowRight'&&r.x)x=1;else if(e.key==='ArrowUp'&&r.y)y=0;else if(e.key==='ArrowDown'&&r.y)y=1;else return;e.preventDefault();if(x!==p.x||y!==p.y){p.x=x;p.y=y;updateFilm();sfx('slide');testWin()}}});
function verify(){for(const [idx,lv] of LEVELS.entries()){let count=0;const cfg=lv.rules;const states=r=>{let ret=[];for(let t=0;t<(r.r?4:1);t++)for(let x=0;x<(r.x?2:1);x++)for(let y=0;y<(r.y?2:1);y++)ret.push({r:t,x,y});return ret};for(const pa of states(cfg[0]))for(const pb of states(cfg[1])){const a=sheetPositions(lv.masks[0],pa),b=sheetPositions(lv.masks[1],pb);let sum=0;for(const p of a)if(b.has(p))sum+=lv.values[p];if(sum===lv.target)count++}if(count<1||count>3)throw new Error(`Stage ${idx+1}: ${count} solutions`);}}
try{verify();selectStage(stage)}catch(e){console.error(e);$('board').innerHTML='<p style="padding:32px">Problem verification failed.</p>'}
</script></body></html>
